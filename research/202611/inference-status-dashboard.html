  <script>
/* Reusable render pieces shared by several views. All return HTML strings. */
(function () {
  const IX = window.IX;
  const { esc, fmtNum, fmtPct, fmtMs, STATUS_META, STATUS_ORDER } = IX;

  const SEVERITY_RANK = Object.fromEntries(STATUS_ORDER.map((s, i) => [s, i]));
  const UNHEALTHY = ['unavailable', 'degraded', 'unknown'];
  const REGION_VARS = ['--r1', '--r2', '--r3', '--r4', '--r5', '--r6'];
  const regionColor = (world, rid) => `var(${REGION_VARS[world.regions.findIndex((r) => r.id === rid)] || '--muted'})`;
  const regionName = (world, rid) => (world.regions.find((r) => r.id === rid) || {}).name || rid;

  const glyph = (status, extra = '') => `<span class="sg ${status}" role="img" aria-label="${esc((STATUS_META[status] || { label: status }).label)}" ${extra}></span>`;
  const statusPill = (status) => {
    const m = STATUS_META[status];
    return `<span class="pill ${m.tone}">${glyph(status)}${m.label}</span>`;
  };

  // ---- grouping / filtering -----------------------------------------------------------
  const GROUP_DIMS = [
    { id: 'model', label: 'Model' },
    { id: 'region', label: 'Region' },
    { id: 'cluster', label: 'Cluster' },
    { id: 'gpu', label: 'GPU' },
    { id: 'engine', label: 'Engine' },
    { id: 'version', label: 'Version' },
    { id: 'status', label: 'Status' },
  ];

  function groupInfo(p, dim, world) {
    switch (dim) {
      case 'model': return { key: p.model, label: world.modelsById[p.model].name, order: world.models.findIndex((m) => m.id === p.model) };
      case 'region': return { key: p.region, label: `${regionName(world, p.region)}`, sub: (world.regions.find((r) => r.id === p.region) || {}).code, order: world.regions.findIndex((r) => r.id === p.region) };
      case 'status': return { key: p.status, label: STATUS_META[p.status].label, order: SEVERITY_RANK[p.status] };
      case 'version': return { key: p.model + ' ' + p.version.split(' · ')[0], label: `${world.modelsById[p.model].name} ${p.version.split(' · ')[0]}`, order: world.models.findIndex((m) => m.id === p.model) };
      default: return { key: p[dim], label: p[dim], order: 0 };
    }
  }

  function matchesFilters(p, f, world) {
    if (f.search) {
      const q = f.search.toLowerCase();
      const hay = `${p.id} ${world.modelsById[p.model].name} ${p.model} ${p.region} ${p.cluster} ${p.gpu}`.toLowerCase();
      if (!q.split(/\s+/).every((t) => hay.includes(t))) return false;
    }
    if (f.statuses.length && !f.statuses.includes(p.status)) return false;
    if (f.region && p.region !== f.region) return false;
    if (f.model && p.model !== f.model) return false;
    if (f.unhealthyOnly && !UNHEALTHY.includes(p.status) && !p.hot) return false;
    if (f.trafficOnly && p.traffic < 0.01) return false;
    return true;
  }
  const filtersActive = (f) => !!(f.search || f.statuses.length || f.region || f.model || f.unhealthyOnly || f.trafficOnly);

  function poolImpact(p, world) {
    const m = world.modelsById[p.model];
    const bad = UNHEALTHY.includes(p.status) ? 1 : p.hot ? 0.3 : 0;
    return bad * (m.failed * 50 + IX.configuredCap(p) - p.capacity + p.failoverIn + p.traffic * 0.1);
  }
  const SORTS = {
    stable: { label: 'Fixed order', pool: (a, b) => a.idx - b.idx },
    severity: { label: 'Severity', pool: (a, b) => SEVERITY_RANK[a.status] - SEVERITY_RANK[b.status] || (b.hot - a.hot) || a.idx - b.idx },
    impact: { label: 'Customer impact', pool: null },
    traffic: { label: 'Traffic', pool: (a, b) => b.traffic - a.traffic },
    latency: { label: 'Latency vs SLO', pool: (a, b) => (b.sloMetric / b.sloMs || 0) - (a.sloMetric / a.sloMs || 0) },
    util: { label: 'Utilization', pool: (a, b) => b.util - a.util },
  };
  function sortPools(pools, sort, world) {
    if (sort === 'impact') return [...pools].sort((a, b) => poolImpact(b, world) - poolImpact(a, world) || SEVERITY_RANK[a.status] - SEVERITY_RANK[b.status] || a.idx - b.idx);
    return [...pools].sort(SORTS[sort].pool);
  }

  // ---- metric encoding for cells ---------------------------------------------------------
  const METRICS = [
    { id: 'status', label: 'Status' },
    { id: 'util', label: 'Utilization' },
    { id: 'latency', label: 'TTFT / latency vs SLO' },
    { id: 'traffic', label: 'Traffic' },
    { id: 'kv', label: 'KV cache' },
  ];
  function metricNorm(p, metric, maxTraffic) {
    switch (metric) {
      case 'util': return { v: p.util, txt: fmtPct(p.util, 0), warn: p.util >= 0.8, crit: p.util >= 0.9 };
      case 'latency': { const r = p.sloMetric ? p.sloMetric / p.sloMs : 0; return { v: Math.min(1, r), txt: fmtMs(p.sloMetric), warn: r >= 0.8, crit: r > 1 }; }
      case 'traffic': return { v: maxTraffic ? Math.sqrt(p.traffic / maxTraffic) : 0, txt: fmtNum(p.traffic, 1) + ' rps' };
      case 'kv': return p.kv == null ? { v: 0, txt: 'n/a (embedding)' } : { v: p.kv, txt: fmtPct(p.kv, 0), warn: p.kv >= 0.85, crit: p.kv >= 0.95 };
      default: return null;
    }
  }

  function cell(p, state, world, maxTraffic, isDimmed) {
    const metric = state.metric;
    const mv = metric !== 'status' ? metricNorm(p, metric, maxTraffic) : null;
    let style = '';
    const plain = p.status === 'operational' || p.status === 'standby';
    if (mv && plain && p.traffic > 0) {
      const tint = mv.crit ? 'var(--crit)' : mv.warn ? 'var(--warn)' : 'var(--cell-hi)';
      const pct = mv.crit || mv.warn ? 70 : Math.round(8 + mv.v * 80);
      style = `style="background:color-mix(in srgb, ${tint} ${pct}%, var(--cell-lo))"`;
    }
    const cls = ['cell', 's-' + p.status, mv ? 'metric' : '', p.hot && metric === 'status' ? 'hot' : '', state.selection?.id === p.id ? 'sel' : '', isDimmed ? 'dimmed' : ''].join(' ');
    return `<button class="${cls}" ${style} data-act="pool" data-id="${p.id}" data-tip="${p.id}" tabindex="-1" aria-label="${esc(p.id)}: ${esc(STATUS_META[p.status].label)}"></button>`;
  }

  function collapsedSummary(pools) {
    const parts = STATUS_ORDER.map((s) => [s, pools.filter((p) => p.status === s).length]).filter(([, n]) => n);
    if (parts.length === 1 && parts[0][0] === 'operational') return `${pools.length} pools · all serving normally`;
    return parts.map(([s, n]) => `${n} ${STATUS_META[s].label.toLowerCase()}`).join(' · ');
  }

  function statusBar(pools) {
    const total = pools.length || 1;
    const segs = STATUS_ORDER.map((s) => [s, pools.filter((p) => p.status === s).length]).filter(([, n]) => n);
    const colors = { operational: 'var(--ok-dim)', degraded: 'var(--warn)', unavailable: 'var(--crit)', draining: 'var(--info)', unknown: 'var(--muted)', standby: 'color-mix(in srgb, var(--standby) 35%, transparent)' };
    return `<div class="collapsed-bar">${segs.map(([s, n]) => `<span style="width:${(n / total) * 100}%;background:${colors[s]}" title="${n} ${STATUS_META[s].label}"></span>`).join('')}</div>`;
  }

  /**
   * Fleet matrix. Every pool keeps a fixed slot inside its group (stable `idx` order) so
   * operators learn where things live; filters dim cells instead of reflowing them.
   */
  function matrix(world, state, { groupBy, compact = false } = {}) {
    const dim = groupBy || state.groupBy;
    const groups = Object.values(world.pools.reduce((acc, p) => {
      const g = groupInfo(p, dim, world);
      const cur = acc[g.key] || { ...g, pools: [] };
      return { ...acc, [g.key]: { ...cur, pools: [...cur.pools, p] } };
    }, {}));
    const maxTraffic = Math.max(...world.pools.map((p) => p.traffic));
    const sortedGroups = [...groups].sort((a, b) => {
      if (state.sort === 'stable' || dim === 'status') return a.order - b.order || String(a.label).localeCompare(b.label);
      const ra = sortPools(a.pools, state.sort, world)[0];
      const rb = sortPools(b.pools, state.sort, world)[0];
      return sortPools([ra, rb], state.sort, world)[0] === ra ? -1 : 1;
    });
    const small = world.pools.length > 160;
    const fa = filtersActive(state.filters);
    const rows = sortedGroups.map((g) => {
      const pools = [...g.pools].sort((a, b) => a.idx - b.idx);
      const bad = pools.filter((p) => UNHEALTHY.includes(p.status));
      const crit = pools.filter((p) => p.status === 'unavailable').length;
      const healthy = !bad.length;
      const key = dim + ':' + g.key;
      const collapsed = state.collapsed[key] ?? (state.collapseHealthy && healthy && !fa);
      const matches = pools.filter((p) => matchesFilters(p, state.filters, world));
      if (fa && !matches.length && state.filters.unhealthyOnly) return '';
      const traffic = IX.sum(pools, (p) => p.traffic);
      const meta = `<span class="grp-meta">${crit ? `<span class="bad" title="${crit} unavailable">${glyph('unavailable')}${crit}</span>` : ''}${bad.length - crit ? `<span class="warnc" title="${bad.length - crit} degraded or unknown">${glyph('degraded')}${bad.length - crit}</span>` : ''}<span title="Traffic">${fmtNum(traffic, 0)} rps</span><span title="Pools">${pools.length}p</span></span>`;
      const body = collapsed
        ? `<div><div class="grp-summary"><span>${collapsedSummary(pools)}</span></div>${statusBar(pools)}</div>`
        : `<div class="cells" role="group" aria-label="${esc(g.label)}">${pools.map((p) => cell(p, state, world, maxTraffic, fa && !matches.includes(p))).join('')}</div>`;
      return `<div class="grp ${collapsed ? 'collapsed' : ''}"><button class="grp-h" data-act="toggle-group" data-key="${esc(key)}" aria-expanded="${!collapsed}"><span class="caret">▼</span><span class="grp-name">${esc(g.label)}</span>${g.sub ? `<span class="faint mono" style="font-size:10.5px">${esc(g.sub)}</span>` : ''}${meta}</button>${body}</div>`;
    }).join('');
    const size = small || compact ? 'small-cells' : world.pools.length <= 120 ? 'large-cells' : '';
    return `<div class="matrix ${size}" data-matrix>${rows || '<div class="empty">No pools match these filters.</div>'}</div>`;
  }

  function legend(world, state, { clickable = true } = {}) {
    const items = STATUS_ORDER.map((s) => {
      const n = world.statusCounts[s];
      const on = state.filters.statuses.includes(s);
      return clickable
        ? `<button class="chip" data-act="status-filter" data-status="${s}" aria-pressed="${on}" ${n ? '' : 'disabled'}>${glyph(s)}${STATUS_META[s].label}<span class="n">${n}</span></button>`
        : `<span class="li">${glyph(s)}${STATUS_META[s].label} <span class="faint mono">${n}</span></span>`;
    }).join('');
    const ramp = state.metric !== 'status' ? `<span class="ramp">${esc(METRICS.find((m) => m.id === state.metric).label)} <i></i> high · <span class="tone-warn">warn</span> / <span class="tone-crit">crit</span></span>` : `<span class="ramp"><span class="cell hot" style="--cell:10px;display:inline-block;width:10px;height:10px"></span> ≥80% utilisation</span>`;
    return `<div class="chips">${items}</div>${ramp}`;
  }

  // ---- model pips / tooltip / incident card ---------------------------------------------
  function modelPips(m, world, region, maxPips = 12) {
    const pools = region ? m.pools.filter((p) => p.region === region) : m.pools;
    if (!pools.length) return '<span class="faint">—</span>';
    const pip = (p) => `<span data-tip="${p.id}" data-act="pool" data-id="${p.id}" style="cursor:pointer">${glyph(p.status)}</span>`;
    if (pools.length > maxPips) {
      // Exception-first: unhealthy pools stay individually clickable, healthy ones collapse to counts.
      const odd = pools.filter((p) => p.status !== 'operational' && p.status !== 'standby').sort((a, b) => SEVERITY_RANK[a.status] - SEVERITY_RANK[b.status]);
      const ok = pools.length - odd.length;
      return `<span class="pips">${odd.slice(0, maxPips - 2).map(pip).join('')}${odd.length > maxPips - 2 ? `<span class="faint mono" style="font-size:10.5px">+${odd.length - maxPips + 2}</span>` : ''}${glyph('operational')}<span class="mono dim" style="font-size:11px">${ok}</span></span>`;
    }
    return `<span class="pips">${pools.map((p) => `<span data-tip="${p.id}" data-act="pool" data-id="${p.id}" style="cursor:pointer">${glyph(p.status)}</span>`).join('')}</span>`;
  }

  function tooltip(p, world) {
    const m = world.modelsById[p.model];
    const chat = m.kind === 'chat';
    const rows = [
      ['Model', m.name], ['Region', `${regionName(world, p.region)} · ${p.cluster}`], ['Replicas', `${p.ready}/${p.desired} ready`],
      ['Routing', p.eligible ? (p.standby ? 'Eligible · standby' : 'Eligible') : 'Excluded'], ['Traffic', `${fmtNum(p.traffic, 1)} req/s${p.failoverIn > 0.05 ? ` (${fmtNum(p.failoverIn, 1)} failover)` : ''}`],
      ['Utilization', fmtPct(p.util, 0)], [chat ? 'TTFT p95' : 'Latency p95', p.traffic ? fmtMs(p.sloMetric) : '—'],
    ];
    return `<div class="tip-h">${glyph(p.status)}${esc(p.id)}</div><div class="tip-g">${rows.map(([k, v]) => `<span>${k}</span><b>${esc(v)}</b>`).join('')}</div>${p.issues.length ? `<div class="tip-i">${p.issues.map(esc).join('<br>')}</div>` : ''}`;
  }

  function compChips(inc, limit = 4) {
    const chips = inc.proxy
      ? [`<button class="comp-chip" data-act="goto-proxy">${glyph('degraded')}central-proxy</button>`]
      : inc.affected.slice(0, limit).map((p) => `<button class="comp-chip" data-act="pool" data-id="${p.id}">${glyph(p.status)}${esc(p.id)}</button>`);
    const more = !inc.proxy && inc.affected.length > limit ? `<button class="comp-chip" data-act="incident" data-id="${inc.id}">+${inc.affected.length - limit} more</button>` : '';
    return chips.join('') + more;
  }

  function incidentCard(inc, state) {
    const sel = state.selectedIncident === inc.id;
    return `<div class="inc ${sel ? 'sel' : ''}" role="button" tabindex="0" data-act="incident" data-id="${inc.id}">
      <div class="inc-top"><span class="sev sev-${inc.severity}">SEV${inc.severity}</span><span class="id">${inc.id}</span><span class="dur" title="Duration">${IX.fmtDur(inc.onsetMin)}</span></div>
      <div class="inc-title">${esc(inc.title)}</div>
      <div class="inc-rows">
        <span class="k">Customers</span><span class="v tone-${inc.customer === 'none' ? 'ok' : inc.customer}">${esc(inc.impact)}</span>
        <span class="k">Capacity</span><span class="v">${esc(inc.capacityImpact)}</span>
        <span class="k">Status</span><span class="v tone-${inc.mitigationTone}">${esc(inc.mitigation)}</span>
      </div>
      <div class="inc-chips">${compChips(inc)}</div>
    </div>`;
  }

  Object.assign(IX, { glyph, statusPill, GROUP_DIMS, METRICS, SORTS, matrix, legend, matchesFilters, filtersActive, sortPools, modelPips, tooltip, incidentCard, compChips, regionColor, regionName, UNHEALTHY, SEVERITY_RANK, metricNorm });
})();

</script>
  <script>
/* Overview: answers the seven five-second questions top-down —
   verdict → where in the request path → key numbers → models → fleet. */
(function () {
  const IX = window.IX;
  const { esc, fmtNum, fmtPct, fmtMs, fmtSuccess, sparkline, glyph } = IX;

  const RANGE_MIN = { '15m': 15, '1h': 60, '6h': 360, '24h': 1440 };
  const rangeMin = (state) => RANGE_MIN[state.range];

  /** History for a platform metric, using the healthy (normal) world as the baseline. */
  function platformSeries(world, state, key, pick, opts = {}) {
    const base = IX.getWorld(world.size, 'normal').platform;
    const ramp = world.scenario === 'saturation' ? 50 : 2;
    return IX.series(`${world.scenario}:${world.size}:${key}:${state.range}`, {
      current: pick(world.platform), baseline: pick(base), onsetMin: world.platform.onsetMin, rangeMin: rangeMin(state), rampMin: ramp, noise: 0.02, ...opts,
    });
  }

  function verdict(world) {
    const L = world.layers;
    const v = L.verdict;
    const icon = { ok: '✓', warn: '!', crit: '!' }[v.tone];
    const layer = (n, label, l, act) => `<div class="layer" ${act ? `data-act="${act}" role="button" tabindex="0" style="cursor:pointer"` : ''}>
      <span class="eyebrow"><span class="rank">${n}</span>${label}</span>
      <span class="layer-v"><span class="dot ${l.tone}"></span>${esc(l.value)}</span>
      <span class="layer-d" title="${esc(l.detail)}">${esc(l.detail)}</span></div>`;
    return `<section class="verdict" aria-label="Platform status">
      <div class="verdict-head ${v.tone}"><span class="verdict-icon ${v.tone}" aria-hidden="true">${icon}</span>
        <div><h1>${esc(v.title)}</h1><p>${esc(v.sub)}</p></div></div>
      ${layer(1, 'Customer impact', L.customer, 'goto-incidents')}
      ${layer(2, 'Model availability', L.models, 'goto-models')}
      ${layer(3, 'Capacity', L.capacity, 'goto-capacity')}
      ${layer(4, 'Components', L.components, 'goto-pools')}
    </section>`;
  }

  function requestPath(world) {
    const P = world.platform;
    const px = P.proxy;
    const clientsTone = P.failed / P.demand >= 0.001 ? 'crit' : world.models.some((m) => m.latencyBreach) ? 'warn' : '';
    const proxyTone = !px.healthy ? 'crit' : '';
    const c = world.statusCounts;
    const poolsBad = c.unavailable + c.degraded + c.unknown;
    const poolsTone = world.models.some((m) => m.status === 'unavailable') || P.shed > 0.05 ? 'crit' : poolsBad ? 'warn' : '';
    const backendFail = P.shed + P.backendErr;
    const failTotal = P.failed || 1;
    const arrow = `<div class="arrow" aria-hidden="true"><svg viewBox="0 0 22 12"><path d="M1 6h18M15 2l4 4-4 4" stroke="currentColor" fill="none" stroke-width="1.3"/></svg></div>`;
    const kv = (k, v, cls = '') => `<div class="kv"><span class="k">${k}</span><span class="v ${cls}">${v}</span></div>`;
    const origin = P.failed / P.demand >= 0.001
      ? `<div><div class="attrib" title="Failure origin"><span style="width:${(P.proxyFail / failTotal) * 100}%;background:var(--crit)"></span><span style="width:${(backendFail / failTotal) * 100}%;background:var(--warn)"></span></div>
         <div class="faint" style="font-size:11px;margin-top:4px">Failure origin · <span class="tone-crit">proxy ${fmtPct(P.proxyFail / failTotal, 0)}</span> · <span class="tone-warn">backend ${fmtPct(backendFail / failTotal, 0)}</span></div></div>`
      : `<div class="faint" style="font-size:11px">Background error rate only (${fmtPct(P.failed / P.demand, 2)}) · nothing to attribute</div>`;
    return `<section class="path" aria-label="Request path">
      <button class="hop ${clientsTone}" data-act="goto-incidents">
        <div class="hop-h">${glyph(clientsTone === 'crit' ? 'unavailable' : clientsTone ? 'degraded' : 'operational')}<b>Clients</b><span class="grow"></span><span class="faint" style="font-size:11px">customer-observed</span></div>
        <div class="hop-stats">${kv('Requests', `${fmtNum(P.demand, 0)}<small>/s</small>`)}${kv('Success', fmtSuccess(P.success), P.success < 0.999 ? 'tone-crit' : '')}${kv('Failing', `${fmtNum(P.failed, 1)}<small>/s</small>`, P.failed / P.demand >= 0.001 ? 'tone-crit' : '')}</div>
        ${origin}
      </button>${arrow}
      <button class="hop ${proxyTone}" data-act="goto-proxy">
        <div class="hop-h">${glyph(px.healthy ? 'operational' : 'unavailable')}<b>Central proxy</b><span class="grow"></span><span class="mono faint" style="font-size:11px">${px.ready}/${px.desired} replicas</span></div>
        <div class="hop-stats">${kv('Overhead p99', `${px.p99.toFixed(1)}<small> ms</small>`, px.p99 > 12 ? 'tone-warn' : '')}${kv('Routing failures', `${fmtNum(px.routingFail + px.internalErr, 1)}<small>/s</small>`, px.failFrac > 0.001 ? 'tone-crit' : '')}${kv('Failover', fmtPct(px.failoverRate, 1), px.failoverRate > 0.01 ? 'tone-warn' : '')}</div>
        <div class="faint" style="font-size:11px">Config ${px.inSync}/${px.ready} in sync · ${px.eligible}/${px.discovered} pools routing-eligible</div>
      </button>${arrow}
      <button class="hop ${poolsTone}" data-act="goto-pools">
        <div class="hop-h">${glyph(poolsTone === 'crit' ? 'unavailable' : poolsTone ? 'degraded' : 'operational')}<b>Model pools</b><span class="grow"></span><span class="mono faint" style="font-size:11px">${world.pools.length} pools · ${world.regions.length} regions</span></div>
        <div class="hop-stats">${kv('Healthy', `${world.pools.length - poolsBad - c.draining - c.standby}<small>/${world.pools.length - c.draining - c.standby}</small>`, poolsBad ? 'tone-warn' : '')}${kv('Failed over', `${fmtNum(P.failoverRps, 0)}<small>/s</small>`, P.failoverRps > 1 ? 'tone-warn' : '')}${kv('Shed (no capacity)', `${fmtNum(P.shed, 1)}<small>/s</small>`, P.shed > 0.05 ? 'tone-crit' : '')}</div>
        <div class="faint" style="font-size:11px">${c.unavailable} unavailable · ${c.degraded} degraded · ${c.unknown} unknown · ${c.draining} draining · ${c.standby} standby</div>
      </button>
    </section>`;
  }

  function metricStrip(world, state) {
    const P = world.platform;
    const stat = (k, v, spark, right = '') => `<div class="stat"><span class="k"><span>${k}</span><span>${right}</span></span><span class="v">${v}</span>${spark}</div>`;
    const succ = platformSeries(world, state, 'succ', (p) => p.success, { noise: 0.00005 });
    const thr = platformSeries(world, state, 'thr', (p) => p.served);
    const tok = platformSeries(world, state, 'tok', (p) => p.outTokS);
    const ttft = platformSeries(world, state, 'ttft', (p) => p.ttftP95);
    const fo = platformSeries(world, state, 'fo', (p) => p.failoverRps, { noise: 0.06 });
    const burnTone = P.burnRate >= 14 ? 'crit' : P.burnRate >= 2 ? 'warn' : 'ok';
    return `<section class="strip" aria-label="Key metrics">
      ${stat('Success rate', fmtSuccess(P.success), sparkline(succ, { tone: P.success < 0.999 ? 'crit' : 'neutral' }), '<span class="faint">SLO 99.9%</span>')}
      ${stat('Served', `${fmtNum(P.served, 0)}<small>req/s</small>`, sparkline(thr))}
      ${stat('Output tokens', `${fmtNum(P.outTokS, 0)}<small>tok/s</small>`, sparkline(tok))}
      ${stat('TTFT p95 · chat', fmtMs(P.ttftP95), sparkline(ttft, { tone: P.ttftP95 > IX.getWorld(world.size, 'normal').platform.ttftP95 * 1.15 ? 'warn' : 'neutral' }), '<span class="faint">client-observed</span>')}
      ${stat('Error budget · 30d', `${fmtPct(P.budgetRemaining, 0)}<small>left</small>`, `<span class="mono tone-${burnTone}" style="font-size:11px;align-self:end">${P.burnRate.toFixed(1)}× burn</span>`)}
      ${stat('Failover traffic', `${fmtNum(P.failoverRps, 0)}<small>req/s</small>`, sparkline(fo, { tone: P.failoverRps > 1 ? 'warn' : 'neutral' }), `<span class="faint">${fmtNum(P.crossRps, 0)} cross-region</span>`)}
    </section>`;
  }

  function modelsCompact(world, state) {
    const rows = world.models.map((m) => {
      const ms = IX.MODEL_STATUS[m.status];
      const lat = m.clientMetric != null ? fmtMs(m.clientMetric) : '—';
      const attn = m.status === 'unavailable' || m.status === 'impaired' ? 'attn-crit' : m.status !== 'available' ? 'attn' : '';
      return `<tr class="${attn}" data-act="model" data-id="${m.id}">
        <td><div class="name">${esc(m.name)}</div><div class="tone-${ms.tone}" style="font-size:11px">${esc(ms.label)}</div></td>
        <td>${IX.modelPips(m, world)}<div class="faint mono" style="font-size:10.5px;margin-top:2px">${m.healthyCount}/${m.pools.length} healthy · ${m.regionsServing.length}/${m.regionsConfigured.length} regions</div></td>
        <td class="r num ${m.success < 0.999 ? 'tone-crit' : ''}">${fmtSuccess(m.success)}</td>
        <td class="r num ${m.latencyBreach ? 'tone-warn' : ''}">${lat}<div class="faint" style="font-size:10px">SLO ${fmtMs(m.slo)}</div></td>
        <td class="r">${IX.meter(1 - m.headroom, { warn: 0.8, crit: 0.92, w: 46 })} <span class="num" style="font-size:11.5px">${fmtPct(Math.max(0, m.headroom), 0)}</span></td>
        <td class="r">${m.status === 'unavailable' ? '<span class="tone-crit">—</span>' : m.failoverOk ? '<span class="tone-ok" title="Survives losing its largest pool">✓ safe</span>' : '<span class="tone-warn" title="Losing the largest pool would overload the rest">✕ unsafe</span>'}</td>
      </tr>`;
    }).join('');
    return `<section class="panel">
      <div class="panel-h"><h2>Model availability</h2><span class="sub">customer-facing · ${world.models.length} models</span><span class="grow"></span><button class="link" data-act="goto-models">All models →</button></div>
      <table class="t"><thead><tr><th>Model</th><th>Pools</th><th class="r">Success</th><th class="r">p95 latency</th><th class="r">Headroom</th><th class="r">N−1</th></tr></thead><tbody>${rows}</tbody></table>
    </section>`;
  }

  function fleetPanel(world, state) {
    const ovState = { ...state, groupBy: state.ovGroup, sort: 'stable' };
    const seg = ['region', 'model', 'cluster'].map((g) => `<button aria-pressed="${state.ovGroup === g}" data-act="ov-group" data-group="${g}">${g[0].toUpperCase() + g.slice(1)}</button>`).join('');
    const metricSel = `<select class="sel" data-change="metric" aria-label="Cell metric">${IX.METRICS.map((m) => `<option value="${m.id}" ${state.metric === m.id ? 'selected' : ''}>${m.label}</option>`).join('')}</select>`;
    return `<section class="panel">
      <div class="panel-h"><h2>Fleet</h2><span class="sub">${world.pools.length} pools</span><span class="grow"></span><span class="seg">${seg}</span>${metricSel}<button class="link" data-act="goto-pools">Open →</button></div>
      <div class="legend">${IX.legend(world, ovState)}</div>
      ${IX.matrix(world, ovState, { groupBy: state.ovGroup, compact: world.pools.length > 60 })}
    </section>`;
  }

  function render(world, state) {
    return `${verdict(world)}${requestPath(world)}${metricStrip(world, state)}
      <div class="cols">${modelsCompact(world, state)}${fleetPanel(world, state)}</div>
      <div class="foot-note">All telemetry is simulated. Aggregates are summed from per-pool routing outcomes; customer impact comes from simulated request failures, not from component counts.</div>`;
  }

  IX.views = { ...(IX.views || {}), overview: render };
  Object.assign(IX, { platformSeries, RANGE_MIN });
})();

</script>
  <script>
/* Model Pools: full fleet with grouping, filtering, sorting; matrix ⇄ virtualised table. */
(function () {
  const IX = window.IX;
  const { esc, fmtNum, fmtPct, fmtMs, glyph } = IX;

  const ROW_H = 31;
  const OVERSCAN = 12;

  function toolbar(world, state) {
    const f = state.filters;
    const opts = (items, cur) => items.map(([v, l]) => `<option value="${esc(v)}" ${cur === v ? 'selected' : ''}>${esc(l)}</option>`).join('');
    return `<div class="toolbar">
      <div class="search"><svg viewBox="0 0 12 12"><circle cx="5" cy="5" r="3.6"/><path d="M8 8l3 3"/></svg>
        <input id="pool-search" type="search" placeholder="Search pool, model, cluster…" value="${esc(f.search)}" data-input="search" aria-label="Search pools" autocomplete="off"><kbd>/</kbd></div>
      <select class="sel" data-change="filter-region" aria-label="Region filter">${opts([['', 'All regions'], ...world.regions.map((r) => [r.id, r.name])], f.region)}</select>
      <select class="sel" data-change="filter-model" aria-label="Model filter">${opts([['', 'All models'], ...world.models.map((m) => [m.id, m.name])], f.model)}</select>
      <label class="toggle"><input type="checkbox" data-change="unhealthy" ${f.unhealthyOnly ? 'checked' : ''}>Needs attention only</label>
      <label class="toggle"><input type="checkbox" data-change="traffic" ${f.trafficOnly ? 'checked' : ''}>Receiving traffic</label>
      ${IX.filtersActive(f) ? '<button class="link" data-act="reset-filters">Reset filters</button>' : ''}
      <span style="flex:1"></span>
      <span class="ctl"><label>Group</label><select class="sel" data-change="group">${opts(IX.GROUP_DIMS.map((d) => [d.id, d.label]), state.groupBy)}</select></span>
      <span class="ctl"><label>Sort</label><select class="sel" data-change="sort">${opts(Object.entries(IX.SORTS).map(([k, v]) => [k, v.label]), state.sort)}</select></span>
      <span class="ctl"><label>Color</label><select class="sel" data-change="metric">${opts(IX.METRICS.map((m) => [m.id, m.label]), state.metric)}</select></span>
      <span class="seg" role="group" aria-label="View mode"><button data-act="mode" data-mode="matrix" aria-pressed="${state.fleetMode === 'matrix'}">Matrix</button><button data-act="mode" data-mode="table" aria-pressed="${state.fleetMode === 'table'}">Table</button></span>
    </div>`;
  }

  function shares(world) {
    return Object.fromEntries(world.models.map((m) => {
      const W = IX.sum(m.pools, IX.weightOf) || 1;
      return [m.id, Object.fromEntries(m.pools.map((p) => [p.id, { cfg: IX.weightOf(p) / W, act: m.served ? p.traffic / m.served : 0 }]))];
    }));
  }

  function rowHtml(p, world, state, sh) {
    const m = world.modelsById[p.model];
    const s = sh[p.model][p.id];
    const attn = p.status === 'unavailable' ? 'attn-crit' : IX.UNHEALTHY.includes(p.status) ? 'attn' : '';
    const share = `${fmtPct(s.act, 0)} <span class="faint">/ ${fmtPct(s.cfg, 0)}</span>`;
    const drift = Math.abs(s.act - s.cfg) > 0.08 ? 'tone-warn' : '';
    return `<tr class="${attn} ${state.selection?.id === p.id ? 'sel' : ''}" data-act="pool" data-id="${p.id}" style="height:${ROW_H}px">
      <td>${glyph(p.status)}</td><td class="mono name">${esc(p.id)}</td><td>${esc(m.name)}</td><td>${esc(IX.regionName(world, p.region))}</td>
      <td class="mono dim">${esc(p.cluster)}</td><td class="dim">${esc(p.gpu)} · ${esc(p.engine)}</td>
      <td class="r num ${p.ready < p.desired ? 'tone-warn' : ''}">${p.ready}/${p.desired}</td>
      <td>${p.eligible ? (p.standby ? '<span class="tone-standby">standby</span>' : '<span class="dim">eligible</span>') : '<span class="tone-crit">excluded</span>'}</td>
      <td class="r num">${fmtNum(p.traffic, 1)}</td><td class="r num ${drift}">${share}</td>
      <td class="r">${IX.meter(p.util, { w: 40 })} <span class="num">${fmtPct(p.util, 0)}</span></td>
      <td class="r num ${p.sloMetric > p.sloMs ? 'tone-warn' : ''}">${p.traffic ? fmtMs(p.sloMetric) : '—'}</td>
      <td class="r num">${m.kind === 'chat' && p.traffic ? fmtMs(p.tpot) : '—'}</td>
      <td class="r num ${p.queued > 50 ? 'tone-warn' : ''}">${fmtNum(p.queued, 0)}</td>
      <td class="dim" style="max-width:260px;overflow:hidden;text-overflow:ellipsis">${esc(p.issues[0] || '')}</td></tr>`;
  }

  const COLS = [['', 30], ['Pool', 130], ['Model', 140], ['Region', 120], ['Cluster', 110], ['GPU · engine', 160], ['Ready', 60, 'r'], ['Routing', 80], ['Req/s', 70, 'r'], ['Share act/cfg', 100, 'r'], ['Util', 100, 'r'], ['p95', 80, 'r'], ['TPOT', 64, 'r'], ['Queue', 60, 'r'], ['Issue', 260]];

  function visibleRows(world, state) {
    const pools = world.pools.filter((p) => IX.matchesFilters(p, state.filters, world));
    return IX.sortPools(pools, state.sort === 'stable' ? 'severity' : state.sort, world);
  }

  function tableBody(rows, world, state, scrollTop, viewH) {
    const sh = shares(world);
    const start = Math.max(0, Math.floor(scrollTop / ROW_H) - OVERSCAN);
    const end = Math.min(rows.length, Math.ceil((scrollTop + viewH) / ROW_H) + OVERSCAN);
    const top = `<tr aria-hidden="true" style="height:${start * ROW_H}px"><td colspan="${COLS.length}" style="padding:0;border:0"></td></tr>`;
    const bottom = `<tr aria-hidden="true" style="height:${(rows.length - end) * ROW_H}px"><td colspan="${COLS.length}" style="padding:0;border:0"></td></tr>`;
    return top + rows.slice(start, end).map((p) => rowHtml(p, world, state, sh)).join('') + bottom;
  }

  function table(world, state) {
    const rows = visibleRows(world, state);
    const head = COLS.map(([l, , c]) => `<th class="${c || ''}">${l}</th>`).join('');
    const cols = COLS.map(([, w]) => `<col style="width:${w}px">`).join('');
    return `<div class="vt" data-vt><table class="t" style="table-layout:fixed;min-width:1600px"><colgroup>${cols}</colgroup><thead><tr>${head}</tr></thead>
      <tbody data-vt-body>${tableBody(rows, world, state, 0, 900)}</tbody></table></div>
      <div class="foot-note" style="padding:6px 12px">${rows.length} of ${world.pools.length} pools · virtualised rows (only visible rows are in the DOM)</div>`;
  }

  /** Re-render only the visible window while scrolling the table. */
  function attach(world, state) {
    const vt = document.querySelector('[data-vt]');
    if (!vt) return;
    const rows = visibleRows(world, state);
    const body = vt.querySelector('[data-vt-body]');
    let raf = 0;
    vt.addEventListener('scroll', () => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => { body.innerHTML = tableBody(rows, world, state, vt.scrollTop, vt.clientHeight); });
    });
  }

  function render(world, state) {
    const f = state.filters;
    const matching = world.pools.filter((p) => IX.matchesFilters(p, f, world)).length;
    const big = world.pools.length >= 250;
    return `<div class="view-h"><h1>Model pools</h1><span class="sub">${world.pools.length} pools · ${world.models.length} models · ${world.regions.length} regions${IX.filtersActive(f) ? ` · ${matching} match` : ''}</span><span class="grow"></span>
        ${state.fleetMode === 'matrix' ? `<button class="link" data-act="expand-all">Expand all</button><button class="link" data-act="collapse-all">Collapse all</button><label class="toggle"><input type="checkbox" data-change="collapse-healthy" ${state.collapseHealthy ? 'checked' : ''}>Collapse healthy groups</label>` : ''}</div>
      <section class="panel">${toolbar(world, state)}
        ${state.fleetMode === 'matrix'
          ? `<div class="legend" style="padding-bottom:4px">${IX.legend(world, state)}</div>${IX.matrix(world, state)}<div class="foot-note" style="padding:4px 12px 10px">Cells keep fixed positions inside each group; filters dim non-matching pools rather than reflowing the grid. ${big ? 'Healthy groups collapse to a status bar at this fleet size.' : ''} Arrow keys move, Enter inspects.</div>`
          : table(world, state)}
      </section>`;
  }

  IX.views = { ...(IX.views || {}), pools: render };
  IX.attachPools = attach;
  IX.poolShares = shares;
})();

</script>

/* Models: availability is a property of a model, not of a pool. Shows redundancy per
   region and whether failover capacity is sufficient (N−1). */
(function () {
  const IX = window.IX;
  const { esc, fmtNum, fmtPct, fmtMs, fmtSuccess, glyph } = IX;

  function failoverAnalysis(m) {
    const elig = m.pools.filter((p) => p.eligible);
    if (!elig.length) return `<b class="tone-crit">No eligible pool.</b> All ${fmtNum(m.demand, 1)} req/s of demand fail with “no eligible backend”.`;
    const largest = [...elig].sort((a, b) => b.capacity - a.capacity)[0];
    const remaining = m.capacity - largest.capacity * IX.MAX_UTIL;
    const gap = m.served - remaining;
    return gap > 0
      ? `If <span class="mono">${esc(largest.id)}</span> (largest eligible pool) fails, remaining capacity is <b>${fmtNum(remaining, 1)} req/s</b> against <b>${fmtNum(m.served, 1)} req/s</b> demand — a <b class="tone-warn">${fmtNum(gap, 1)} req/s shortfall</b> would be shed.`
      : `If <span class="mono">${esc(largest.id)}</span> (largest eligible pool) fails, the remaining <b>${fmtNum(remaining, 1)} req/s</b> of capacity covers the <b>${fmtNum(m.served, 1)} req/s</b> demand with ${fmtPct(1 - m.served / remaining, 0)} to spare.`;
  }

  function detail(m, world) {
    const sh = IX.poolShares(world)[m.id];
    const rows = [...m.pools].sort((a, b) => a.idx - b.idx).map((p) => `<tr data-act="pool" data-id="${p.id}" class="${p.status === 'unavailable' ? 'attn-crit' : IX.UNHEALTHY.includes(p.status) ? 'attn' : ''}">
      <td>${glyph(p.status)}</td><td class="mono name">${esc(p.id)}</td><td>${esc(IX.regionName(world, p.region))}</td><td class="dim">${esc(p.gpu)}</td>
      <td class="r num">${p.ready}/${p.desired}</td><td class="r num">${fmtNum(p.traffic, 1)}</td><td class="r num">${fmtPct(sh[p.id].act, 0)} <span class="faint">/ ${fmtPct(sh[p.id].cfg, 0)}</span></td>
      <td class="r num ${p.failoverIn > 0.05 ? 'tone-warn' : 'faint'}">${fmtNum(p.failoverIn, 1)}</td><td class="r">${IX.meter(p.util, { w: 46 })} <span class="num">${fmtPct(p.util, 0)}</span></td>
      <td class="dim">${esc(p.issues[0] || '')}</td></tr>`).join('');
    return `<div class="model-detail"><div class="callout" style="margin:8px 0 10px">${failoverAnalysis(m)}${m.crossRps > 0.5 ? ` <span class="dim">${fmtNum(m.crossRps, 1)} req/s currently served cross-region (+${world.rttMs} ms).</span>` : ''}</div>
      <table class="t"><thead><tr><th></th><th>Pool</th><th>Region</th><th>GPU</th><th class="r">Ready</th><th class="r">Req/s</th><th class="r">Share act/cfg</th><th class="r">Failover in</th><th class="r">Util</th><th>Issue</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  function render(world, state) {
    const regions = world.regions;
    const cols = `220px 200px repeat(${regions.length}, minmax(64px, 1fr)) 150px 110px 100px`;
    const head = `<div class="model-row head" style="grid-template-columns:${cols}"><span>Model</span><span>Availability</span>${regions.map((r) => `<span>${esc(r.name)}</span>`).join('')}<span>Capacity · headroom</span><span style="text-align:right">p95 vs SLO</span><span style="text-align:right">Success</span></div>`;
    const rows = world.models.map((m) => {
      const ms = IX.MODEL_STATUS[m.status];
      const open = state.selectedModel === m.id;
      return `<div class="model-card"><div class="model-row" style="grid-template-columns:${cols}" data-act="model" data-id="${m.id}" aria-expanded="${open}">
        <span><span class="caret faint" style="display:inline-block;width:12px;transform:rotate(${open ? 0 : -90}deg)">▼</span><b>${esc(m.name)}</b><div class="faint mono" style="font-size:10.5px;padding-left:12px">${m.kind} · ${m.pools.length} pools · ${m.eligibleCount} eligible</div></span>
        <span><span class="tone-${ms.tone}">${esc(ms.label)}</span><div class="faint" style="font-size:11px">${m.healthyCount}/${m.pools.length} healthy · ${m.regionsServing.length}/${m.regionsConfigured.length} regions serving${m.draining ? ` · ${m.draining} draining` : ''}</div></span>
        ${regions.map((r) => `<span>${IX.modelPips(m, world, r.id, 8)}</span>`).join('')}
        <span>${IX.meter(1 - Math.max(0, m.headroom), { warn: 0.8, crit: 0.92, w: 60 })} <span class="num">${fmtPct(Math.max(0, m.headroom), 0)}</span><div class="faint mono" style="font-size:10.5px">${fmtNum(m.served, 0)} / ${fmtNum(m.capacity, 0)} req/s · N−1 ${m.failoverOk ? '<span class="tone-ok">safe</span>' : '<span class="tone-warn">unsafe</span>'}</div></span>
        <span class="num" style="text-align:right"><span class="${m.latencyBreach ? 'tone-warn' : ''}">${m.clientMetric != null ? fmtMs(m.clientMetric) : '—'}</span><div class="faint" style="font-size:10.5px">${fmtMs(m.slo)}</div></span>
        <span class="num ${m.success < 0.999 ? 'tone-crit' : ''}" style="text-align:right">${fmtSuccess(m.success)}<div class="faint" style="font-size:10.5px">${fmtNum(m.failed, 1)} failing/s</div></span>
      </div>${open ? detail(m, world) : ''}</div>`;
    }).join('');
    return `<div class="view-h"><h1>Models</h1><span class="sub">A model stays available while any eligible pool can serve it. Redundancy and N−1 show how close it is to not being available.</span></div>
      <section class="panel">${head}${rows}</section>
      <div class="foot-note">Region columns show each pool serving the model in that region. Click a model for its failover analysis and per-pool routing.</div>`;
  }

  IX.views = { ...(IX.views || {}), models: render };
})();

  <script>
/* Routing: what the proxy is actually doing — configured vs actual distribution,
   cross-region flows, exclusions and routing anomalies. */
(function () {
  const IX = window.IX;
  const { esc, fmtNum, fmtPct, glyph } = IX;

  const MAX_SEGMENTS = 14; // beyond this, per-pool segments become unreadable → aggregate by region

  function distribution(world, state) {
    const byRegion = state.routingSeg === 'region' || world.models.some((m) => m.pools.length > MAX_SEGMENTS) && state.routingSeg !== 'pool';
    const rows = world.models.map((m) => {
      const W = IX.sum(m.pools, IX.weightOf) || 1;
      const served = m.served || 1;
      const units = byRegion
        ? world.regions.map((r) => {
          const ps = m.pools.filter((p) => p.region === r.id);
          return { id: r.id, label: r.name, color: IX.regionColor(world, r.id), cfg: IX.sum(ps, IX.weightOf) / W, act: IX.sum(ps, (p) => p.traffic) / served, bad: ps.some((p) => !p.eligible), dead: ps.length > 0 && ps.every((p) => !p.eligible) };
        }).filter((u) => u.cfg > 0 || u.act > 0)
        : [...m.pools].sort((a, b) => a.idx - b.idx).map((p) => ({ id: p.id, label: p.id, color: IX.regionColor(world, p.region), cfg: IX.weightOf(p) / W, act: p.traffic / served, bad: !p.eligible, dead: !p.eligible, pool: true }));
      const seg = (u, key) => (u[key] > 0 ? `<span class="${u.dead && key === 'cfg' ? 'hatch bad' : ''}" style="width:${u[key] * 100}%;background:${u.color}" title="${esc(u.label)}: ${key === 'cfg' ? 'configured' : 'actual'} ${fmtPct(u[key], 1)}" ${u.pool ? `data-act="pool" data-id="${u.id}"` : ''}></span>` : '');
      const drift = IX.sum(units, (u) => Math.abs(u.act - u.cfg)) / 2;
      return `<div class="dist"><span class="dist-name">${glyph(m.status === 'unavailable' ? 'unavailable' : m.unhealthy.length ? 'degraded' : 'operational')}${esc(m.name)}</span>
        <div class="dist-bars"><div class="dist-bar cfg">${units.map((u) => seg(u, 'cfg')).join('')}</div><div class="dist-bar">${m.served ? units.map((u) => seg(u, 'act')).join('') : '<span style="width:100%;background:var(--crit-dim)"></span>'}</div></div>
        <span class="dist-meta">${m.served ? `${fmtNum(m.served, 0)}/s · <span class="${drift > 0.08 ? 'tone-warn' : ''}">${fmtPct(drift, 0)} moved</span>` : '<span class="tone-crit">no traffic served</span>'}</span></div>`;
    }).join('');
    const key = world.regions.map((r) => `<span><i style="background:${IX.regionColor(world, r.id)}"></i>${esc(r.name)}</span>`).join('');
    const seg = ['pool', 'region'].map((s) => `<button data-act="routing-seg" data-seg="${s}" aria-pressed="${(s === 'region') === byRegion}">${s === 'pool' ? 'Per pool' : 'Per region'}</button>`).join('');
    return `<section class="panel"><div class="panel-h"><h2>Traffic distribution by model</h2><span class="sub">thin bar = configured weight · thick bar = actual share · hatched = excluded</span><span class="grow"></span><span class="seg">${seg}</span></div>
      <div style="padding:8px 12px 0"><span class="reg-key">${key}</span></div>${rows}</section>`;
  }

  function flowMatrix(world) {
    const regions = world.regions;
    const flow = (from, to) => IX.sum([...world.flows.entries()].filter(([k]) => { const [, f, t] = k.split('|'); return f === from && t === to; }), ([, v]) => v);
    const max = Math.max(1, ...regions.flatMap((a) => regions.map((b) => (a.id === b.id ? 0 : flow(a.id, b.id)))));
    const dead = (rid) => world.pools.filter((p) => p.region === rid).every((p) => !p.eligible);
    const rows = regions.map((a) => `<tr><th>${esc(a.name)}</th>${regions.map((b) => {
      const v = flow(a.id, b.id);
      const diag = a.id === b.id;
      if (diag && dead(b.id)) return `<td class="dead diag" title="Region unavailable">✕ 0</td>`;
      const style = !diag && v > 0.05 ? `style="background:color-mix(in srgb, var(--warn) ${Math.round(12 + (v / max) * 55)}%, var(--bg-2))"` : '';
      return `<td class="${diag ? 'diag' : v > 0.05 ? 'cross' : ''}" ${style} title="${esc(a.name)} clients → ${esc(b.name)} pools">${v > 0.05 ? fmtNum(v, v < 10 ? 1 : 0) : '·'}</td>`;
    }).join('')}</tr>`).join('');
    return `<section class="panel"><div class="panel-h"><h2>Client region → serving region</h2><span class="sub">req/s · off-diagonal = cross-region (+${world.rttMs} ms)</span></div>
      <div class="panel-b" style="overflow:auto"><table class="flowm"><thead><tr><th></th>${regions.map((r) => `<th class="col">${esc(r.name)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div></section>`;
  }

  function anomalies(world) {
    const items = [];
    world.pools.filter((p) => !p.eligible).forEach((p) => items.push({ p, tone: p.status === 'draining' ? 'info' : 'crit', kind: p.status === 'draining' ? 'Excluded · draining' : 'Excluded · not ready', why: p.cause || p.issues[0] || '' }));
    world.pools.filter((p) => p.eligible && p.util >= 0.9).forEach((p) => items.push({ p, tone: 'warn', kind: 'Saturated, still receiving traffic', why: `${fmtPct(p.util, 0)} util · ${fmtNum(p.traffic, 1)} req/s · queue ${fmtNum(p.queued, 0)}` }));
    const sh = IX.poolShares(world);
    world.pools.filter((p) => p.eligible && !p.standby && p.status !== 'unavailable' && sh[p.model][p.id].cfg > 0.02 && sh[p.model][p.id].act < sh[p.model][p.id].cfg * 0.4).forEach((p) => items.push({ p, tone: 'warn', kind: 'Healthy but under-receiving', why: `actual ${fmtPct(sh[p.model][p.id].act, 0)} vs configured ${fmtPct(sh[p.model][p.id].cfg, 0)}` }));
    world.pools.filter((p) => p.standby && p.traffic > 0.05).forEach((p) => items.push({ p, tone: 'info', kind: 'Standby absorbing failover', why: `${fmtNum(p.traffic, 1)} req/s` }));
    const list = items.slice(0, 60).map((a) => `<div class="anom" data-act="pool" data-id="${a.p.id}" style="cursor:pointer">${glyph(a.p.status)}<span><span class="mono">${esc(a.p.id)}</span> <span class="tone-${a.tone}">${esc(a.kind)}</span><div class="why" style="font-size:11.5px">${esc(a.why)}</div></span><span class="faint mono" style="font-size:11px">${esc(IX.regionName(world, a.p.region))}</span></div>`).join('');
    return `<section class="panel"><div class="panel-h"><h2>Routing exceptions</h2><span class="sub">${items.length} pools</span></div>${list || '<div class="calm"><b>No routing exceptions.</b> Every eligible pool receives its configured share.</div>'}</section>`;
  }

  function tiles(world) {
    const P = world.platform;
    const px = P.proxy;
    const excl = world.pools.filter((p) => !p.eligible).length;
    const stat = (k, v, sub = '') => `<div class="stat"><span class="k">${k}</span><span class="v">${v}</span><span class="faint" style="font-size:11px;grid-column:1/-1">${sub}</span></div>`;
    return `<section class="tiles">
      ${stat('Routing-eligible', `${px.eligible}<small>/${px.discovered}</small>`, `${excl} excluded`)}
      ${stat('Routed', `${fmtNum(P.served, 0)}<small>req/s</small>`, `${fmtNum(P.demand, 0)} req/s incoming`)}
      ${stat('Failover', `${fmtNum(P.failoverRps, 0)}<small>req/s</small>`, fmtPct(px.failoverRate, 1) + ' of traffic')}
      ${stat('Cross-region', `${fmtNum(P.crossRps, 0)}<small>req/s</small>`, `+${world.rttMs} ms RTT`)}
      ${stat('Retries', fmtPct(px.retryRate, 2), 'of requests')}
      ${stat('Unroutable', `${fmtNum(P.shed + px.routingFail, 1)}<small>req/s</small>`, `${fmtNum(P.shed, 1)} no capacity · ${fmtNum(px.routingFail, 1)} stale routes`)}
    </section>`;
  }

  function render(world, state) {
    return `<div class="view-h"><h1>Routing</h1><span class="sub">How the central proxy distributes traffic right now. Local region first, then cross-region failover, then standby.</span></div>
      ${tiles(world)}${distribution(world, state)}<div class="split">${flowMatrix(world)}${anomalies(world)}</div>`;
  }

  IX.views = { ...(IX.views || {}), routing: render };
})();

</script>
  <script>
/* Central proxy: the shared routing layer. Makes "is it the proxy or the backends?"
   answerable by splitting failures by origin. */
(function () {
  const IX = window.IX;
  const { esc, fmtNum, fmtPct, glyph } = IX;

  function render(world, state) {
    const P = world.platform;
    const px = P.proxy;
    const range = IX.RANGE_MIN[state.range];
    const ser = (key, cur, base, o = {}) => IX.series(`${world.scenario}:${world.size}:px:${key}:${state.range}`, { current: cur, baseline: base, onsetMin: px.onsetMin ?? P.onsetMin, rangeMin: range, noise: 0.05, ...o });
    const onsetFrac = (px.onsetMin ?? P.onsetMin) != null && (px.onsetMin ?? P.onsetMin) < range ? 1 - (px.onsetMin ?? P.onsetMin) / range : null;
    const stat = (k, v, sub, tone = '') => `<div class="stat"><span class="k">${k}</span><span class="v ${tone}">${v}</span><span class="faint" style="font-size:11px;grid-column:1/-1">${sub}</span></div>`;
    const backendFail = P.shed + P.backendErr;
    const tiles = `<section class="tiles">
      ${stat('Replicas', `${px.ready}<small>/${px.desired}</small>`, px.ready < px.desired ? `${px.desired - px.ready} down` : 'all ready', px.ready < px.desired ? 'tone-crit' : '')}
      ${stat('Incoming', `${fmtNum(px.rps, 0)}<small>req/s</small>`, `${fmtNum(px.conns, 0)} active connections`)}
      ${stat('Proxy overhead', `${px.p50.toFixed(1)}<small> / ${px.p99.toFixed(1)} ms</small>`, 'p50 / p99 added latency', px.p99 > 12 ? 'tone-warn' : '')}
      ${stat('Proxy-origin failures', `${fmtNum(px.routingFail + px.internalErr, 1)}<small>/s</small>`, `${fmtNum(px.routingFail, 1)} routing · ${fmtNum(px.internalErr, 1)} internal`, px.failFrac > 0.001 ? 'tone-crit' : '')}
      ${stat('Upstream conn errors', `${fmtNum(px.upstreamErr, 1)}<small>/s</small>`, 'to model pools')}
      ${stat('Retry · failover', `${fmtPct(px.retryRate, 2)}<small> · ${fmtPct(px.failoverRate, 1)}</small>`, 'of requests')}
    </section>`;

    const errChart = IX.lineChart([
      { values: ser('perr', px.routingFail + px.internalErr, 0, { noise: 0.08 }), tone: 'crit' },
      { values: ser('berr', backendFail, IX.getWorld(world.size, 'normal').platform.backendErr, { noise: 0.08 }), tone: 'warn' },
    ], { w: 560, h: 150, fmt: (v) => fmtNum(v, v < 10 ? 1 : 0), onsetFrac, rangeLabel: state.range });
    const latChart = IX.lineChart([{ values: ser('p99', px.p99, 5.4), tone: px.p99 > 12 ? 'warn' : 'neutral' }, { values: ser('p50', px.p50, 1.5), tone: 'neutral', dashed: true }], { w: 560, h: 150, fmt: (v) => v.toFixed(1) + 'ms', onsetFrac, rangeLabel: state.range, lo: 0 });

    const origin = `<div class="callout ${px.healthy ? '' : 'crit'}" style="margin:10px 12px">${px.healthy
      ? `Proxy healthy. ${P.failed > 0.05 && backendFail > 0.05 ? `All ${fmtNum(backendFail, 1)} req/s of current failures originate in model pools, not in the proxy.` : 'No proxy-origin failures.'}`
      : `<b>Failures originate in the proxy.</b> ${esc(px.cause || '')} Model pools report healthy; backend-origin failures are ${fmtNum(backendFail, 1)} req/s.`}</div>`;

    const rows = px.instances.map((x) => {
      const status = x.status === 'down' ? 'unavailable' : x.status === 'degraded' ? 'degraded' : 'operational';
      return `<tr class="${x.status === 'down' ? 'attn-crit' : x.status === 'degraded' ? 'attn' : ''} ${state.selection?.id === x.id ? 'sel' : ''}" data-act="proxy-inst" data-id="${x.id}">
        <td>${glyph(status)}</td><td class="mono name">${esc(x.id)}</td><td class="dim">${x.zone}</td>
        <td class="r num">${x.status === 'down' ? '—' : fmtNum(x.rps, 0)}</td><td class="r num">${x.status === 'down' ? '—' : fmtNum(x.conns, 0)}</td>
        <td class="r num">${x.p50 ? x.p50.toFixed(1) : '—'}</td><td class="r num ${x.p99 > 12 ? 'tone-warn' : ''}">${x.p99 ? x.p99.toFixed(1) : '—'}</td>
        <td class="r num ${x.errRate > 0.001 ? 'tone-crit' : ''}">${x.errRate == null ? '—' : fmtPct(x.errRate, 2)}</td>
        <td class="mono ${x.config !== 'rc-1412' ? 'tone-warn' : 'dim'}">${x.config}</td><td class="r">${IX.meter(x.cpu, { w: 40 })}</td><td class="r">${IX.meter(x.mem, { w: 40, warn: 0.8 })}</td>
        <td class="r num ${x.restarts ? 'tone-crit' : 'faint'}">${x.restarts}</td><td class="dim">${esc(x.reason || '')}</td></tr>`;
    }).join('');

    const sync = `<section class="panel"><div class="panel-h"><h2>Routing configuration</h2></div><div class="panel-b"><div class="grid-kv two">
      <div class="kv"><span class="k">Desired config</span><span class="v">rc-1412</span></div>
      <div class="kv"><span class="k">In sync</span><span class="v ${px.inSync < px.ready ? 'tone-warn' : ''}">${px.inSync}/${px.ready} live replicas</span></div>
      <div class="kv"><span class="k">Discovered pools</span><span class="v">${px.discovered}</span></div>
      <div class="kv"><span class="k">Routing-eligible</span><span class="v">${px.eligible}</span></div>
      <div class="kv"><span class="k">Excluded</span><span class="v">${px.discovered - px.eligible}</span></div>
      <div class="kv"><span class="k">Last sync</span><span class="v">${px.staleConfig ? '<span class="tone-warn">drift 6m</span>' : '12s ago'}</span></div></div></div></section>`;

    return `<div class="view-h"><h1>Central proxy</h1><span class="sub">Shared routing layer · deployment <span class="mono">inference-proxy</span> · us-east-1</span></div>
      ${tiles}
      <div class="split"><section class="panel"><div class="panel-h"><h2>Failures by origin</h2><span class="sub"><span class="tone-crit">━ proxy</span> · <span class="tone-warn">━ backend</span> · req/s</span></div>${origin}<div class="panel-b">${errChart}</div></section>
        <section class="panel"><div class="panel-h"><h2>Proxy overhead latency</h2><span class="sub">━ p99 · ┅ p50</span></div><div class="panel-b">${latChart}</div>${sync}</section></div>
      <section class="panel"><div class="panel-h"><h2>Instances</h2><span class="sub">${px.desired} replicas · click to inspect</span></div>
        <table class="t"><thead><tr><th></th><th>Instance</th><th>Zone</th><th class="r">Req/s</th><th class="r">Conns</th><th class="r">p50 ms</th><th class="r">p99 ms</th><th class="r">Errors</th><th>Config</th><th class="r">CPU</th><th class="r">Mem</th><th class="r">Restarts</th><th>Note</th></tr></thead><tbody>${rows}</tbody></table></section>`;
  }

  IX.views = { ...(IX.views || {}), proxy: render };
})();
