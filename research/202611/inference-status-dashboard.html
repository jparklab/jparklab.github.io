  <script>
/* Incidents: impact-ordered list + response view. The rail renders the same cards. */
(function () {
  const IX = window.IX;
  const { esc, fmtNum, fmtPct, glyph } = IX;

  function intentionalOps(world) {
    const standby = world.pools.filter((p) => p.status === 'standby');
    const ops = [...world.pools.filter((p) => p.status === 'draining'), ...(standby.length <= 3 ? standby : [])];
    if (!ops.length && !standby.length) return '';
    const shown = ops.slice(0, 8);
    const standbyRow = standby.length > 3 ? `<div class="ops-row">${glyph('standby')}<span class="grow">${standby.length} standby pools · healthy failover targets, zero configured weight</span></div>` : '';
    return `<div class="ops"><div class="eyebrow" style="margin-bottom:6px">Intentional · not incidents</div>
      ${shown.map((p) => `<div class="ops-row" data-act="pool" data-id="${p.id}" style="cursor:pointer">${glyph(p.status)}<span class="mono">${esc(p.id)}</span><span class="grow">${p.status === 'draining' ? esc(p.cause || 'Draining') : 'Standby · failover target'}</span></div>`).join('')}
      ${ops.length > shown.length ? `<div class="faint" style="font-size:11px">+${ops.length - shown.length} more</div>` : ''}${standbyRow}</div>`;
  }

  function rail(world, state) {
    const incs = world.incidents;
    const stale = world.stale.length;
    const head = `<div class="rail-h"><h2>Active incidents</h2><span class="pill ${incs.some((i) => i.severity <= 1) ? 'crit' : incs.length ? 'warn' : 'ok'}">${incs.length}</span><span class="grow"></span><button class="link" data-act="goto-incidents">Respond →</button></div>
      <div class="faint" style="padding:0 14px 8px;font-size:11px">Ordered by customer impact, then capacity impact</div>`;
    const body = incs.length ? incs.map((i) => IX.incidentCard(i, state)).join('') : `<div class="calm"><b>No active incidents.</b><br>${world.pools.length} pools and the central proxy are within thresholds.</div>`;
    const fresh = `<div class="ops"><div class="eyebrow" style="margin-bottom:6px">Telemetry</div><div class="ops-row"><span class="dot ${stale ? 'warn' : 'ok'}"></span><span class="grow">${world.pools.length - stale}/${world.pools.length} pools reporting${stale ? ` · ${stale} stale` : ''}</span></div><div class="ops-row"><span class="dot ok"></span><span class="grow">Proxy metrics live · simulated feed</span></div></div>`;
    return head + body + intentionalOps(world) + fresh;
  }

  function timeline(inc) {
    const o = inc.onsetMin;
    const steps = [[o, 'First symptom', inc.alerts[0]], [o - 0.5, 'Alert grouped', `${inc.alerts.length} signals correlated into ${inc.id}`]];
    if (inc.mitigationTone === 'ok') steps.push([o - 0.7, 'Auto-mitigation', 'Proxy ejected unhealthy backends; failover engaged']);
    if (inc.proxy) steps.push([o - 1.5, 'Escalation', 'Paged on-call (proxy SLO burn 30×)']);
    steps.push([Math.max(0.3, o * 0.4), 'Current', inc.mitigation]);
    return `<ul class="timeline">${steps.map(([t, k, d]) => `<li><span class="t">−${t < 1 ? '<1' : Math.round(t)}m</span><span class="dot ${k === 'Current' ? 'info' : 'muted'}" style="margin-top:5px"></span><span class="d"><b style="color:var(--text);font-weight:500">${k}</b> · ${esc(d)}</span></li>`).join('')}</ul>`;
  }

  function detail(inc, world, state) {
    if (!inc) return `<section class="panel"><div class="calm"><b>No active incidents.</b> Select a scenario in the top bar to simulate one.</div></section>`;
    const range = IX.RANGE_MIN[state.range];
    const onsetFrac = inc.onsetMin < range ? 1 - inc.onsetMin / range : null;
    const pickers = { success: (p) => p.success };
    const succ = IX.platformSeries(world, state, 'succ', pickers.success, { noise: 0.00005 });
    const primary = inc.primaryPools[0] || inc.relatedPools[0];
    const chartTitle = inc.proxy || inc.modelOutage || inc.failed > 0.05 ? 'Platform success rate' : primary ? `${primary.id} · ${inc.saturation ? 'utilisation' : 'traffic'}` : 'Platform success rate';
    const chart = inc.proxy || inc.modelOutage || inc.failed > 0.05 || !primary
      ? IX.lineChart([{ values: succ, tone: 'crit' }], { w: 1000, h: 200, fmt: (v) => (v * 100).toFixed(2) + '%', threshold: 0.999, onsetFrac, rangeLabel: state.range, hi: 1 })
      : IX.lineChart(inc.affected.slice(0, 6).map((p, i) => ({ values: IX.series(`${world.scenario}:${p.id}:inc:${state.range}`, { current: inc.saturation ? p.util : p.traffic, baseline: inc.saturation ? IX.getWorld(world.size, 'normal').poolsById[p.id].util : IX.getWorld(world.size, 'normal').poolsById[p.id].traffic, onsetMin: inc.onsetMin, rangeMin: range, rampMin: inc.saturation ? 50 : 2, noise: 0.04 }), tone: i === 0 ? (p.status === 'unavailable' ? 'crit' : 'warn') : 'neutral' })), { w: 1000, h: 200, fmt: (v) => (inc.saturation ? fmtPct(v, 0) : fmtNum(v, 0)), onsetFrac, rangeLabel: state.range, threshold: inc.saturation ? 0.9 : null });
    const chips = IX.compChips(inc, 40);
    return `<section class="panel"><div class="panel-h"><span class="sev sev-${inc.severity}">SEV${inc.severity}</span><h2 style="font-size:14px">${esc(inc.title)}</h2><span class="grow"></span><span class="mono faint">${inc.id} · open ${IX.fmtDur(inc.onsetMin)}</span></div>
      <div class="panel-b"><div class="facts">
        <span class="k">Customer impact</span><span class="tone-${inc.customer === 'none' ? 'ok' : inc.customer}">${esc(inc.impact)}</span>
        <span class="k">Capacity impact</span><span>${esc(inc.capacityImpact)}</span>
        <span class="k">Mitigation</span><span class="tone-${inc.mitigationTone}">${esc(inc.mitigation)}</span>
        <span class="k">Probable cause</span><span>${esc(inc.cause)}</span>
        <span class="k">Models</span><span>${inc.proxy ? 'All models (shared routing layer)' : inc.models.map((m) => `<button class="link" data-act="goto-model" data-id="${m.id}">${esc(m.name)}</button> <span class="faint">${esc(IX.MODEL_STATUS[m.status].label)}</span>`).join(' · ')}</span>
        <span class="k">Regions</span><span>${inc.proxy ? 'us-east-1 (proxy)' : inc.regions.map((r) => esc(IX.regionName(world, r))).join(', ')}</span>
        <span class="k">Components</span><span class="inc-chips" style="margin:0">${chips}</span>
        <span class="k">Grouped signals</span><span class="alerts">${inc.alerts.map((a) => `<span class="alert-tag">${esc(a)}</span>`).join('')}</span>
      </div></div>
      <div class="panel-h" style="border-top:1px solid var(--line)"><h2>${esc(chartTitle)}</h2><span class="sub">last ${state.range} · dashed line = incident start</span></div><div class="panel-b">${chart}</div>
      <div class="panel-h" style="border-top:1px solid var(--line)"><h2>Timeline</h2></div><div class="panel-b">${timeline(inc)}</div></section>`;
  }

  function render(world, state) {
    const sel = world.incidents.find((i) => i.id === state.selectedIncident) || world.incidents[0];
    const list = world.incidents.length ? world.incidents.map((i) => IX.incidentCard(i, { ...state, selectedIncident: sel && sel.id })).join('') : '<div class="calm"><b>No active incidents.</b></div>';
    return `<div class="view-h"><h1>Incident response</h1><span class="sub">Related alerts are grouped into one incident per cause. Draining and standby pools are tracked separately.</span></div>
      <div class="inc-layout"><section class="panel inc-list">${list}${intentionalOps(world)}</section>${detail(sel, world, state)}</div>`;
  }

  IX.views = { ...(IX.views || {}), incidents: render };
  IX.renderRail = rail;
})();

</script>
  <script>
/* Right-hand inspector drawer. Opens over the incident rail so the fleet stays visible. */
(function () {
  const IX = window.IX;
  const { esc, fmtNum, fmtPct, fmtMs, fmtAge, sparkline, glyph, meter } = IX;

  function poolSeries(world, state, p, key, pick, opts = {}) {
    const base = IX.getWorld(world.size, 'normal').poolsById[p.id];
    return IX.series(`${world.scenario}:${p.id}:${key}:${state.range}`, {
      current: pick(p), baseline: base ? pick(base) : pick(p), onsetMin: p.onsetMin ?? world.platform.onsetMin, rangeMin: IX.RANGE_MIN[state.range],
      rampMin: world.scenario === 'saturation' ? 50 : 2, noise: 0.04, ...opts,
    });
  }

  function statusExplain(p, world) {
    const m = world.modelsById[p.model];
    const siblings = m.pools.filter((x) => x.id !== p.id && x.traffic > 0);
    switch (p.status) {
      case 'unavailable':
        return { tone: 'crit', text: `Cannot serve requests: no ready replicas. The proxy has ejected the pool; ${m.status === 'unavailable' ? `<b>no other pool can serve ${esc(m.name)}</b>, so its requests fail.` : `its traffic is being served by ${siblings.length} sibling pool${siblings.length === 1 ? '' : 's'} (${fmtNum(IX.sum(siblings, (x) => x.failoverIn), 1)} req/s failover).`}` };
      case 'degraded':
        return { tone: 'warn', text: 'Still serving traffic with reduced capacity or performance.' };
      case 'draining':
        return { tone: 'info', text: 'Intentionally not accepting new requests; in-flight requests are completing. Not an incident.' };
      case 'unknown':
        return { tone: 'warn', text: `Engine telemetry is stale (${fmtAge(p.telemetryAge)}). The proxy's active health checks still pass, so the pool remains routable. Engine metrics below are <b>last known values</b>; traffic and routing numbers are proxy-observed and current.` };
      case 'standby':
        return { tone: 'info', text: 'Healthy and routing-eligible with zero configured weight. Receives traffic only when the proxy fails over.' };
      default:
        return p.failoverIn > 0.05
          ? { tone: 'info', text: `Operational. Absorbing ${fmtNum(p.failoverIn, 1)} req/s of failover traffic from other pools.` }
          : { tone: '', text: 'Operational. Serving traffic within thresholds.' };
    }
  }

  function routingSection(p, world) {
    const sh = IX.poolShares(world)[p.model][p.id];
    const bar = (v, color) => `<div class="bar"><span style="width:${Math.min(100, v * 100)}%;background:${color}"></span></div>`;
    return `<div class="sec"><h4>Routing</h4>
      <div class="grid-kv" style="margin-bottom:10px">
        <div class="kv"><span class="k">Eligibility</span><span class="v ${p.eligible ? '' : 'tone-crit'}">${p.eligible ? (p.standby ? 'Standby' : 'Eligible') : 'Excluded'}</span></div>
        <div class="kv"><span class="k">Traffic</span><span class="v">${fmtNum(p.traffic, 1)}<small> req/s</small></span></div>
        <div class="kv"><span class="k">Failover in</span><span class="v ${p.failoverIn > 0.05 ? 'tone-warn' : ''}">${fmtNum(p.failoverIn, 1)}<small> req/s</small></span></div>
      </div>
      <div class="share"><span class="dim">Configured</span>${bar(sh.cfg, 'var(--text-3)')}<span class="num r">${fmtPct(sh.cfg, 1)}</span>
        <span class="dim">Actual</span>${bar(sh.act, Math.abs(sh.act - sh.cfg) > 0.05 ? 'var(--warn)' : 'var(--text-2)')}<span class="num r">${fmtPct(sh.act, 1)}</span></div>
      <div class="faint" style="font-size:11px;margin-top:6px">Share of ${esc(world.modelsById[p.model].name)} traffic · weight ${fmtNum(IX.weightOf(p), 0)} (capacity-proportional)</div></div>`;
  }

  function replicasSection(p) {
    const cells = Array.from({ length: p.desired }, (_, i) => {
      const faultIdx = i - p.ready;
      if (faultIdx >= 0) {
        const fault = p.replicaFaults[faultIdx] || 'NotReady';
        const pending = /Pending/.test(fault);
        return `<div class="rep ${pending ? 'pending' : 'bad'}" title="${esc(fault)}"><span>r${i}</span><span>${pending ? 'pend' : 'fail'}</span></div>`;
      }
      const u = IX.clamp(p.gpuUtil * IX.jitter(p.id + 'r' + i, 0.05), 0, 0.99);
      return `<div class="rep" title="replica ${i}: Ready · GPU ${Math.round(u * 100)}%"><span>r${i}</span>${meter(u, { w: 38 })}</div>`;
    }).join('');
    const faults = [...new Set(p.replicaFaults)];
    return `<div class="sec"><h4>Replicas <span class="grow"></span><span class="mono ${p.ready < p.desired ? 'tone-warn' : 'faint'}" style="text-transform:none;letter-spacing:0">${p.ready}/${p.desired} ready</span></h4>
      <div class="replicas">${cells}</div>${faults.length ? `<div class="faint" style="font-size:11.5px;margin-top:8px">${faults.map(esc).join('<br>')}</div>` : ''}</div>`;
  }

  function perfSection(p, world, state) {
    const m = world.modelsById[p.model];
    const stale = p.status === 'unknown' ? '<span class="stale-note">stale</span>' : '';
    const idle = p.traffic < 1e-6;
    const row = (k, v, values, tone, isStale) => `<div class="metric-row"><span class="k">${k} ${isStale ? stale : ''}</span><span class="v ${tone || ''}">${idle && isStale ? '—' : v}</span>${sparkline(values, { w: 200, h: 20, tone: tone ? tone.replace('tone-', '') : 'neutral' })}</div>`;
    const s = (key, pick, o) => poolSeries(world, state, p, key, pick, o);
    const rows = [];
    if (m.kind === 'chat') {
      rows.push(row('TTFT p50', fmtMs(p.ttftP50), s('ttft50', (x) => x.ttftP50 || 0), '', true));
      rows.push(row('TTFT p95', fmtMs(p.ttftP95), s('ttft95', (x) => x.ttftP95 || 0), p.ttftP95 > m.ttftSlo ? 'tone-warn' : '', true));
      rows.push(row('TPOT', fmtMs(p.tpot), s('tpot', (x) => x.tpot || 0), '', true));
    }
    rows.push(row('E2E p95', fmtMs(p.latP95), s('e2e', (x) => x.latP95), m.kind !== 'chat' && p.latP95 > m.latencySlo ? 'tone-warn' : '', true));
    rows.push(row('Requests', `${fmtNum(p.traffic, 1)}/s`, s('rps', (x) => x.traffic), ''));
    rows.push(row(m.kind === 'chat' ? 'Output tokens' : 'Input tokens', `${fmtNum(m.kind === 'chat' ? p.outTokS : p.inTokS, 0)}/s`, s('tok', (x) => (m.kind === 'chat' ? x.outTokS : x.inTokS)), ''));
    rows.push(row('Running / queued', `${fmtNum(p.running, 0)} / ${fmtNum(p.queued, 0)}`, s('queue', (x) => x.queued, { noise: 0.1 }), p.queued > 50 ? 'tone-warn' : '', true));
    rows.push(row('Queue wait', fmtMs(p.queueWait), s('qwait', (x) => x.queueWait, { noise: 0.1 }), p.queueWait > 200 ? 'tone-warn' : '', true));
    rows.push(row('Errors · timeouts', `${fmtPct(p.errRate, 2)} · ${fmtPct(p.timeoutRate, 2)}`, s('err', (x) => x.errRate, { noise: 0.15 }), p.errRate > 0.001 ? 'tone-warn' : ''));
    const res = (k, v, tone) => `<div class="kv"><span class="k">${k} ${stale}</span><span class="v">${v == null ? 'n/a' : fmtPct(v, 0)}</span>${v == null ? '' : meter(v, { w: 120 })}</div>`;
    return `<div class="sec"><h4>Resources</h4><div class="grid-kv">${res('GPU utilisation', p.gpuUtil)}${res('GPU memory', p.gpuMem)}${res('KV cache', p.kv)}</div></div>
      <div class="sec"><h4>Performance <span class="grow"></span><span class="faint" style="text-transform:none;letter-spacing:0">last ${state.range}</span></h4>${rows.join('')}</div>`;
  }

  function timelineSection(p, world) {
    const ev = [];
    const ago = (min) => (min < 60 ? `−${Math.round(min)}m` : `−${(min / 60).toFixed(1)}h`);
    if (p.onsetMin != null) {
      const o = p.onsetMin;
      if (p.status === 'unavailable') ev.push([o, 'unavailable', 'Readiness failing on all replicas'], [o - 0.7, 'unavailable', 'Proxy ejected pool from routing'], [o - 0.8, 'operational', 'Failover to sibling pools activated']);
      else if (p.status === 'draining') ev.push([o, 'draining', 'Drain started for rolling deploy r189']);
      else if (p.status === 'unknown') ev.push([o, 'unknown', 'Metrics scrape target down']);
      else ev.push([o, 'degraded', p.cause || 'Health degraded']);
    }
    if (p.failoverIn > 0.05 && p.status !== 'unavailable') ev.push([world.platform.onsetMin || 0, p.status, `Began absorbing failover (${fmtNum(p.failoverIn, 1)} req/s)`]);
    ev.push([180 + IX.rand(p.id + 'dep') * 2000, 'operational', `Deployed ${p.version}`]);
    ev.sort((a, b) => a[0] - b[0]);
    return `<div class="sec"><h4>Health transitions &amp; deploys</h4><ul class="timeline">${ev.map(([t, s, d]) => `<li><span class="t">${ago(t)}</span>${glyph(s)}<span class="d">${esc(d)}</span></li>`).join('')}</ul></div>`;
  }

  function siblingsSection(p, world) {
    const m = world.modelsById[p.model];
    const sh = IX.poolShares(world)[p.model];
    const rows = [...m.pools].sort((a, b) => IX.SEVERITY_RANK[a.status] - IX.SEVERITY_RANK[b.status] || a.idx - b.idx).map((x) => `<button class="sibling ${x.id === p.id ? 'cur' : ''}" data-act="pool" data-id="${x.id}">${glyph(x.status)}<span class="mono">${esc(x.id)} <span class="faint">${esc(IX.regionName(world, x.region))}</span></span><span class="num r dim">${fmtNum(x.traffic, 1)}/s</span><span class="num r">${fmtPct(sh[x.id].act, 0)}</span></button>`).join('');
    const ms = IX.MODEL_STATUS[m.status];
    return `<div class="sec"><h4>Pools serving ${esc(m.name)} <span class="grow"></span><span class="tone-${ms.tone}" style="text-transform:none;letter-spacing:0">${esc(ms.label)}</span></h4>${rows}</div>`;
  }

  function poolDrawer(p, world, state) {
    const m = world.modelsById[p.model];
    const ex = statusExplain(p, world);
    const inc = world.incidents.filter((i) => i.affected.some((x) => x.id === p.id));
    const sibs = m.pools;
    const i = sibs.findIndex((x) => x.id === p.id);
    const prev = sibs[(i - 1 + sibs.length) % sibs.length];
    const next = sibs[(i + 1) % sibs.length];
    return `<div class="drawer-h">${glyph(p.status)}<div class="grow"><h3>${esc(p.id)}</h3><div class="meta">${esc(m.name)} · ${esc(IX.regionName(world, p.region))} · <span class="mono">${esc(p.cluster)}</span></div>
        <div class="meta faint mono" style="font-size:11px">${esc(p.gpu)} · ${esc(p.engine)} · ${esc(p.version)}</div></div>
        <button class="icon-btn" data-act="pool" data-id="${prev.id}" title="Previous ${esc(m.name)} pool">‹</button><button class="icon-btn" data-act="pool" data-id="${next.id}" title="Next ${esc(m.name)} pool">›</button>
        <button class="icon-btn" data-act="close" title="Close (Esc)">✕</button></div>
      <div class="drawer-b">
        <div class="sec">${IX.statusPill(p.status)}<div class="callout ${ex.tone}" style="margin-top:8px">${ex.text}${p.cause ? `<div style="margin-top:6px"><span class="faint">Probable cause:</span> ${esc(p.cause)}</div>` : ''}${p.issues.length ? `<ul>${p.issues.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}</div>
          ${inc.map((x) => `<div style="margin-top:8px"><button class="comp-chip" data-act="incident" data-id="${x.id}"><span class="sev sev-${x.severity}" style="line-height:14px">SEV${x.severity}</span>${x.id} · ${esc(x.title)}</button></div>`).join('')}</div>
        ${routingSection(p, world)}${replicasSection(p)}${perfSection(p, world, state)}${timelineSection(p, world)}${siblingsSection(p, world)}
      </div>`;
  }

  function proxyDrawer(inst, world, state) {
    const px = world.platform.proxy;
    const s = (key, cur, base) => IX.series(`${world.scenario}:${inst.id}:${key}:${state.range}`, { current: cur, baseline: base, onsetMin: px.onsetMin, rangeMin: IX.RANGE_MIN[state.range], noise: 0.05 });
    const baseRps = world.platform.demand / px.desired;
    const status = inst.status === 'down' ? 'unavailable' : inst.status === 'degraded' ? 'degraded' : 'operational';
    const row = (k, v, values, tone) => `<div class="metric-row"><span class="k">${k}</span><span class="v ${tone || ''}">${v}</span>${sparkline(values, { w: 200, h: 20, tone: tone ? tone.replace('tone-', '') : 'neutral' })}</div>`;
    return `<div class="drawer-h">${glyph(status)}<div class="grow"><h3>${esc(inst.id)}</h3><div class="meta">Central proxy instance · ${esc(inst.zone)}</div></div><button class="icon-btn" data-act="close" title="Close (Esc)">✕</button></div>
      <div class="drawer-b">
        <div class="sec">${IX.statusPill(status)}${inst.reason ? `<div class="callout ${status === 'unavailable' ? 'crit' : 'warn'}" style="margin-top:8px">${esc(inst.reason)}</div>` : ''}</div>
        <div class="sec"><h4>Instance</h4><div class="grid-kv">
          <div class="kv"><span class="k">Routing config</span><span class="v ${inst.config !== 'rc-1412' ? 'tone-warn' : ''}">${inst.config}</span></div>
          <div class="kv"><span class="k">Restarts (1h)</span><span class="v ${inst.restarts ? 'tone-crit' : ''}">${inst.restarts}</span></div>
          <div class="kv"><span class="k">Upstream errors</span><span class="v">${fmtNum(inst.upstreamErr, 2)}<small>/s</small></span></div>
          <div class="kv"><span class="k">CPU</span><span class="v">${fmtPct(inst.cpu, 0)}</span></div>
          <div class="kv"><span class="k">Memory</span><span class="v ${inst.mem > 0.8 ? 'tone-warn' : ''}">${fmtPct(inst.mem, 0)}</span></div>
          <div class="kv"><span class="k">Active conns</span><span class="v">${fmtNum(inst.conns, 0)}</span></div></div></div>
        <div class="sec"><h4>Traffic</h4>
          ${row('Requests', `${fmtNum(inst.rps, 0)}/s`, s('rps', inst.rps, baseRps))}
          ${row('Overhead p50', inst.p50 ? inst.p50.toFixed(1) + ' ms' : '—', s('p50', inst.p50 || 0, 1.4))}
          ${row('Overhead p99', inst.p99 ? inst.p99.toFixed(1) + ' ms' : '—', s('p99', inst.p99 || 0, 5.2), inst.p99 > 12 ? 'tone-warn' : '')}
          ${row('Error rate', inst.errRate == null ? '—' : fmtPct(inst.errRate, 2), s('err', inst.errRate || 0, 0.0001), inst.errRate > 0.001 ? 'tone-crit' : '')}</div>
      </div>`;
  }

  function render(world, state) {
    const sel = state.selection;
    if (!sel) return '';
    if (sel.kind === 'pool' && world.poolsById[sel.id]) return poolDrawer(world.poolsById[sel.id], world, state);
    if (sel.kind === 'proxy') {
      const inst = world.platform.proxy.instances.find((x) => x.id === sel.id);
      if (inst) return proxyDrawer(inst, world, state);
    }
    return '';
  }

  IX.renderInspector = render;
})();

</script>
  <script>
/* App shell: immutable state, top bar, navigation, event delegation, keyboard, tooltip. */
(function () {
  const IX = window.IX;
  const { esc } = IX;

  const VIEWS = [
    { id: 'overview', label: 'Overview', icon: '<path d="M3 3h6v6H3zM11 3h6v4h-6zM11 9h6v8h-6zM3 11h6v6H3z"/>' },
    { id: 'models', label: 'Models', icon: '<path d="M10 2l7 4v8l-7 4-7-4V6z"/><path d="M3 6l7 4 7-4M10 10v8"/>' },
    { id: 'pools', label: 'Pools', icon: '<rect x="3" y="3" width="4" height="4"/><rect x="8" y="3" width="4" height="4"/><rect x="13" y="3" width="4" height="4"/><rect x="3" y="8" width="4" height="4"/><rect x="8" y="8" width="4" height="4"/><rect x="13" y="8" width="4" height="4"/><rect x="3" y="13" width="4" height="4"/><rect x="8" y="13" width="4" height="4"/>' },
    { id: 'routing', label: 'Routing', icon: '<path d="M3 10h4l3-6h7M10 10h7M7 10l3 6h7"/>' },
    { id: 'proxy', label: 'Proxy', icon: '<circle cx="10" cy="10" r="3"/><path d="M2 10h5M13 10h5M10 2v5M10 13v5"/>' },
    { id: 'incidents', label: 'Incidents', icon: '<path d="M10 3l8 14H2z"/><path d="M10 8v4M10 14.5v.5"/>' },
  ];
  const RANGES = ['15m', '1h', '6h', '24h'];
  const EMPTY_FILTERS = { search: '', statuses: [], region: '', model: '', unhealthyOnly: false, trafficOnly: false };

  let state = {
    view: 'overview', size: 48, scenario: 'single', range: '1h', theme: 'dark',
    groupBy: 'model', ovGroup: 'model', metric: 'status', sort: 'stable', fleetMode: 'matrix', routingSeg: 'auto',
    filters: EMPTY_FILTERS, collapsed: {}, collapseHealthy: false,
    selection: null, selectedIncident: null, selectedModel: null,
  };

  const world = () => IX.getWorld(state.size, state.scenario);

  function setState(patch) {
    state = { ...state, ...(typeof patch === 'function' ? patch(state) : patch) };
    render();
  }
  const setFilters = (patch) => setState((s) => ({ filters: { ...s.filters, ...patch } }));

  // ---- shell rendering --------------------------------------------------------------
  function topBar(w) {
    const sizes = IX.FLEET_SIZES.map((n) => `<button data-act="size" data-size="${n}" aria-pressed="${state.size === n}">${n}</button>`).join('');
    const ranges = RANGES.map((r) => `<button data-act="range" data-range="${r}" aria-pressed="${state.range === r}">${r}</button>`).join('');
    const scen = IX.SCENARIOS.map((s) => `<option value="${s.id}" ${state.scenario === s.id ? 'selected' : ''}>${esc(s.label)}</option>`).join('');
    return `<div class="brand"><span class="brand-mark" aria-hidden="true"></span></div>
      <div class="crumb"><b>Inference Platform</b><span class="faint">/</span><span class="dim">Status</span><span class="env">prod</span><span class="sim-flag" title="All telemetry on this page is simulated">SIMULATED DATA</span></div>
      <span class="top-spacer"></span>
      <span class="ctl"><label for="scenario">Scenario</label><select id="scenario" class="sel" data-change="scenario" title="${esc(IX.scenarioById(state.scenario).hint)}">${scen}</select></span>
      <span class="ctl"><label>Pools</label><span class="seg" role="group" aria-label="Simulated fleet size">${sizes}</span></span>
      <span class="ctl"><label>Range</label><span class="seg" role="group" aria-label="Time range">${ranges}</span></span>
      <span class="fresh" title="Simulated scrape cycle"><span class="pulse"></span><span id="fresh-age">updated 2s ago</span></span>
      <button class="icon-btn" data-act="theme" title="Toggle light/dark theme">${state.theme === 'dark' ? '☀' : '☾'}</button>`;
  }

  function nav(w) {
    const bad = w.statusCounts.unavailable + w.statusCounts.degraded + w.statusCounts.unknown;
    const badges = {
      incidents: w.incidents.length ? `<span class="badge ${w.incidents.some((i) => i.severity <= 2) ? '' : 'warn'}">${w.incidents.length}</span>` : '',
      proxy: w.platform.proxy.healthy ? '' : '<span class="badge">!</span>',
      pools: bad ? `<span class="badge warn">${bad}</span>` : '',
      models: w.models.some((m) => m.status === 'unavailable' || m.status === 'impaired') ? '<span class="badge">!</span>' : '',
    };
    return VIEWS.map((v, i) => `<button data-act="view" data-view="${v.id}" ${state.view === v.id ? 'aria-current="page"' : ''} title="${v.label} (${i + 1})"><svg viewBox="0 0 20 20" aria-hidden="true">${v.icon}</svg>${v.label}${badges[v.id] || ''}</button>`).join('')
      + `<span class="nav-foot"></span>`;
  }

  let lastView = null;
  function render() {
    const w = world();
    if (state.selection?.kind === 'pool' && !w.poolsById[state.selection.id]) state = { ...state, selection: null };
    document.documentElement.dataset.theme = state.theme;
    const app = document.getElementById('app');
    app.classList.toggle('no-rail', state.view === 'incidents');

    const active = document.activeElement;
    const focusId = active && active.id;
    const caret = focusId && active.selectionStart;
    const main = document.querySelector('.main');
    const scroll = lastView === state.view ? main.scrollTop : 0;

    document.querySelector('.top').innerHTML = topBar(w);
    document.querySelector('.nav').innerHTML = nav(w);
    main.innerHTML = IX.views[state.view](w, state);
    document.querySelector('.rail').innerHTML = state.view === 'incidents' ? '' : IX.renderRail(w, state);
    const drawer = document.querySelector('.drawer');
    drawer.innerHTML = IX.renderInspector(w, state);
    drawer.classList.toggle('open', !!state.selection);

    main.scrollTop = scroll;
    lastView = state.view;
    if (focusId) {
      const el = document.getElementById(focusId);
      if (el) { el.focus(); if (caret != null && el.setSelectionRange) el.setSelectionRange(caret, caret); }
    }
    if (state.view === 'pools' && state.fleetMode === 'table') IX.attachPools(w, state);
    document.querySelectorAll('[data-matrix]').forEach((m) => {
      const first = m.querySelector('.cell.sel') || m.querySelector('.cell');
      if (first) first.tabIndex = 0;
    });
  }

  // ---- actions ------------------------------------------------------------------------
  const ACTIONS = {
    view: (d) => setState({ view: d.view }),
    size: (d) => { const size = Number(d.size); setState({ size, collapsed: {}, collapseHealthy: size >= 250 }); },
    range: (d) => setState({ range: d.range }),
    theme: () => setState({ theme: state.theme === 'dark' ? 'light' : 'dark' }),
    pool: (d) => setState({ selection: { kind: 'pool', id: d.id } }),
    'proxy-inst': (d) => setState({ selection: { kind: 'proxy', id: d.id } }),
    close: () => setState({ selection: null }),
    incident: (d) => setState({ view: 'incidents', selectedIncident: d.id }),
    model: (d) => setState({ view: 'models', selectedModel: state.view === 'models' && state.selectedModel === d.id ? null : d.id }),
    'goto-model': (d) => setState({ view: 'models', selectedModel: d.id }),
    'goto-incidents': () => setState({ view: 'incidents' }),
    'goto-models': () => setState({ view: 'models' }),
    'goto-capacity': () => setState({ view: 'models' }),
    'goto-pools': () => setState({ view: 'pools' }),
    'goto-proxy': () => setState({ view: 'proxy' }),
    'ov-group': (d) => setState({ ovGroup: d.group }),
    mode: (d) => setState({ fleetMode: d.mode }),
    'routing-seg': (d) => setState({ routingSeg: d.seg }),
    'status-filter': (d) => setFilters({ statuses: state.filters.statuses.includes(d.status) ? state.filters.statuses.filter((s) => s !== d.status) : [...state.filters.statuses, d.status] }),
    'reset-filters': () => setState({ filters: EMPTY_FILTERS }),
    'toggle-group': (d) => {
      const el = document.querySelector(`[data-key="${CSS.escape(d.key)}"]`);
      const isOpen = el && el.getAttribute('aria-expanded') === 'true';
      setState((s) => ({ collapsed: { ...s.collapsed, [d.key]: isOpen } }));
    },
    'expand-all': () => setState({ collapsed: Object.fromEntries([...document.querySelectorAll('[data-act="toggle-group"]')].map((b) => [b.dataset.key, false])) }),
    'collapse-all': () => setState({ collapsed: Object.fromEntries([...document.querySelectorAll('[data-act="toggle-group"]')].map((b) => [b.dataset.key, true])) }),
  };

  const CHANGES = {
    scenario: (v) => setState({ scenario: v, selectedIncident: null }),
    metric: (v) => setState({ metric: v }),
    group: (v) => setState({ groupBy: v }),
    sort: (v) => setState({ sort: v }),
    'filter-region': (v) => setFilters({ region: v }),
    'filter-model': (v) => setFilters({ model: v }),
    unhealthy: (v, el) => setFilters({ unhealthyOnly: el.checked }),
    traffic: (v, el) => setFilters({ trafficOnly: el.checked }),
    'collapse-healthy': (v, el) => setState({ collapseHealthy: el.checked, collapsed: {} }),
  };

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || !ACTIONS[el.dataset.act]) return;
    e.stopPropagation();
    hideTip();
    ACTIONS[el.dataset.act](el.dataset);
  });
  document.addEventListener('change', (e) => {
    const el = e.target.closest('[data-change]');
    if (el && CHANGES[el.dataset.change]) CHANGES[el.dataset.change](el.value, el);
  });
  document.addEventListener('input', (e) => {
    if (e.target.dataset.input === 'search') setFilters({ search: e.target.value });
  });

  // ---- keyboard -----------------------------------------------------------------------
  function moveInMatrix(cell, key) {
    const cells = [...cell.closest('[data-matrix]').querySelectorAll('.cell')];
    const i = cells.indexOf(cell);
    let target = null;
    if (key === 'ArrowRight') target = cells[i + 1];
    if (key === 'ArrowLeft') target = cells[i - 1];
    if (key === 'ArrowDown' || key === 'ArrowUp') {
      const r = cell.getBoundingClientRect();
      const down = key === 'ArrowDown';
      const rows = cells.map((c) => [c, c.getBoundingClientRect()]).filter(([, b]) => (down ? b.top > r.top + 2 : b.top < r.top - 2));
      if (rows.length) {
        const rowTop = down ? Math.min(...rows.map(([, b]) => b.top)) : Math.max(...rows.map(([, b]) => b.top));
        target = rows.filter(([, b]) => Math.abs(b.top - rowTop) < 2).sort((a, b) => Math.abs(a[1].left - r.left) - Math.abs(b[1].left - r.left))[0][0];
      }
    }
    if (target) { cell.tabIndex = -1; target.tabIndex = 0; target.focus(); showTipFor(target); }
  }

  document.addEventListener('keydown', (e) => {
    const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
    if (e.key === 'Escape') {
      if (typing) { document.activeElement.blur(); return; }
      if (state.selection) setState({ selection: null });
      return;
    }
    if (typing) return;
    if (e.target.classList && e.target.classList.contains('cell') && e.key.startsWith('Arrow')) { e.preventDefault(); moveInMatrix(e.target, e.key); return; }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute('role') === 'button') { e.preventDefault(); e.target.click(); return; }
    if (e.key === '/') { e.preventDefault(); setState({ view: 'pools' }); document.getElementById('pool-search')?.focus(); return; }
    const n = Number(e.key);
    if (n >= 1 && n <= VIEWS.length && !e.metaKey && !e.ctrlKey) setState({ view: VIEWS[n - 1].id });
  });

  // ---- tooltip ------------------------------------------------------------------------
  const tip = () => document.querySelector('.tip');
  function hideTip() { tip().style.display = 'none'; }
  function placeTip(x, y) {
    const t = tip();
    const w = t.offsetWidth, h = t.offsetHeight;
    t.style.left = Math.min(window.innerWidth - w - 8, x + 14) + 'px';
    t.style.top = (y + h + 20 > window.innerHeight ? y - h - 10 : y + 14) + 'px';
  }
  function showTipFor(el, x, y) {
    const p = world().poolsById[el.dataset.tip];
    if (!p) return;
    const t = tip();
    t.innerHTML = IX.tooltip(p, world());
    t.style.display = 'block';
    const r = el.getBoundingClientRect();
    placeTip(x ?? r.right, y ?? r.bottom);
  }
  document.addEventListener('mouseover', (e) => { const el = e.target.closest('[data-tip]'); if (el) showTipFor(el, e.clientX, e.clientY); });
  document.addEventListener('mousemove', (e) => { if (tip().style.display === 'block' && e.target.closest('[data-tip]')) placeTip(e.clientX, e.clientY); });
  document.addEventListener('mouseout', (e) => { if (e.target.closest('[data-tip]') && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('[data-tip]'))) hideTip(); });
  document.addEventListener('focusout', hideTip);

  // ---- freshness ticker (simulated 15 s scrape cycle) -------------------------------------
  let age = 2;
  setInterval(() => {
    age = (age + 1) % 15;
    const el = document.getElementById('fresh-age');
    if (el) el.textContent = `updated ${age}s ago`;
  }, 1000);

  render();
})();

</script>
