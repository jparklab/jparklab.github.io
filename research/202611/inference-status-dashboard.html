<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inference Platform · Status (simulated)</title>
  <style>
/* ------------------------------------------------------------------ tokens */
:root {
  --bg: #0a0c0f;
  --bg-1: #0f1216;
  --bg-2: #14181d;
  --bg-3: #1a1f26;
  --line: #1f252d;
  --line-2: #2a313b;
  --text: #e4e7eb;
  --text-2: #a7afba;
  --text-3: #6f7883;
  --accent: #8ab4ff;

  --ok: #3fb68b;
  --ok-dim: #1d3a30;
  --ok-cell: #1b2a25;
  --warn: #e3a23c;
  --warn-dim: #3a2c14;
  --crit: #ef5a5f;
  --crit-dim: #41191c;
  --info: #5b93f5;
  --info-dim: #172745;
  --muted: #7b8490;
  --muted-dim: #22272e;
  --standby: #5fb59a;

  --r1: #7aa2f7; /* region categorical: muted, distinct from status hues */
  --r2: #b48ead;
  --r3: #88c0d0;
  --r4: #d8a47f;
  --r5: #a3be8c;
  --r6: #c0a0e0;

  --cell-lo: #1b2129;
  --cell-hi: #9fb4cc;
  --font: 'Inter', 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
  --radius: 4px;
  --cell: 16px;
  color-scheme: dark;
}
:root[data-theme='light'] {
  --bg: #f6f7f9;
  --bg-1: #ffffff;
  --bg-2: #f3f4f6;
  --bg-3: #e9ecef;
  --line: #e3e6ea;
  --line-2: #d3d8de;
  --text: #15191e;
  --text-2: #4a535e;
  --text-3: #808893;
  --accent: #2f6fe0;
  --ok: #1f8a63;
  --ok-dim: #dcf1e8;
  --ok-cell: #e4efe9;
  --warn: #b8770f;
  --warn-dim: #fbecd2;
  --crit: #d23a40;
  --crit-dim: #fbdfe0;
  --info: #2f6fe0;
  --info-dim: #dde8fc;
  --muted: #8a929c;
  --muted-dim: #eceef1;
  --standby: #2d9273;
  --cell-lo: #e7ebf0;
  --cell-hi: #3c5a7d;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font: 13px/1.4 var(--font);
  font-feature-settings: 'tnum' 1, 'cv11' 1;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.dim { color: var(--text-2); }
.faint { color: var(--text-3); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ------------------------------------------------------------------ shell */
.app {
  display: grid;
  grid-template-rows: 44px 1fr;
  grid-template-columns: 60px minmax(0, 1fr) 344px;
  grid-template-areas: 'top top top' 'nav main rail';
  height: 100vh;
}
.app.no-rail { grid-template-columns: 60px minmax(0, 1fr) 0; }
.top {
  grid-area: top; display: flex; align-items: center; gap: 14px;
  padding: 0 12px 0 0; border-bottom: 1px solid var(--line); background: var(--bg-1);
}
.brand { width: 60px; display: grid; place-items: center; height: 100%; border-right: 1px solid var(--line); }
.brand-mark { width: 18px; height: 18px; border: 1.5px solid var(--text); border-radius: 3px; position: relative; }
.brand-mark::after { content: ''; position: absolute; inset: 4px; background: var(--text); border-radius: 1px; }
.crumb { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.crumb b { font-weight: 600; letter-spacing: -0.01em; }
.env { font: 11px var(--mono); color: var(--text-2); border: 1px solid var(--line-2); padding: 1px 6px; border-radius: 3px; }
.sim-flag { font: 600 10px var(--mono); letter-spacing: 0.06em; color: var(--warn); border: 1px dashed var(--warn); padding: 1px 6px; border-radius: 3px; }
.top-spacer { flex: 1; }
.ctl { display: flex; align-items: center; gap: 6px; color: var(--text-3); font-size: 11px; }
.ctl label { text-transform: uppercase; letter-spacing: 0.06em; }
select.sel, .seg {
  background: var(--bg-2); border: 1px solid var(--line-2); border-radius: var(--radius); height: 26px; padding: 0 8px; color: var(--text);
}
.seg { display: inline-flex; padding: 0; overflow: hidden; }
.seg button { background: none; border: 0; padding: 0 9px; height: 24px; color: var(--text-2); font-size: 12px; border-right: 1px solid var(--line-2); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed='true'] { background: var(--bg-3); color: var(--text); }
.fresh { display: flex; align-items: center; gap: 6px; font: 11px var(--mono); color: var(--text-2); }
.pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
.icon-btn { background: var(--bg-2); border: 1px solid var(--line-2); border-radius: var(--radius); height: 26px; min-width: 26px; padding: 0 7px; color: var(--text-2); }
.icon-btn:hover { color: var(--text); }

.nav { grid-area: nav; border-right: 1px solid var(--line); background: var(--bg-1); display: flex; flex-direction: column; padding: 8px 0; gap: 2px; }
.nav button {
  background: none; border: 0; height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  color: var(--text-3); font-size: 10px; position: relative;
}
.nav button svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.5; }
.nav button:hover { color: var(--text-2); }
.nav button[aria-current='page'] { color: var(--text); }
.nav button[aria-current='page']::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 2px; background: var(--text); }
.nav .badge { position: absolute; top: 6px; right: 12px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px; font: 600 9px/15px var(--mono); color: #fff; background: var(--crit); }
.nav .badge.warn { background: var(--warn); color: #1a1205; }
.nav .nav-foot { margin-top: auto; }

.main { grid-area: main; overflow: auto; padding: 14px 16px 28px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.rail { grid-area: rail; border-left: 1px solid var(--line); background: var(--bg-1); overflow: auto; min-width: 0; }
.no-rail .rail { display: none; }

/* ------------------------------------------------------------------ primitives */
.panel { background: var(--bg-1); border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
.panel-h { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); min-height: 38px; }
.panel-h h2 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.01em; }
.panel-h .sub { color: var(--text-3); font-size: 12px; }
.panel-h .grow { flex: 1; }
.panel-b { padding: 10px 12px; }
.eyebrow { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-3); font-weight: 500; }
.link { background: none; border: 0; padding: 0; color: var(--text-2); font-size: 12px; text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
.link:hover { color: var(--text); text-decoration-color: var(--text-3); }

.tone-ok { color: var(--ok); } .tone-warn { color: var(--warn); } .tone-crit { color: var(--crit); }
.tone-info { color: var(--info); } .tone-muted { color: var(--muted); } .tone-standby { color: var(--standby); } .tone-none { color: var(--ok); }

.pill { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 3px; font-size: 11.5px; font-weight: 500; white-space: nowrap; border: 1px solid transparent; }
.pill.ok { color: var(--ok); background: var(--ok-dim); }
.pill.warn { color: var(--warn); background: var(--warn-dim); }
.pill.crit { color: var(--crit); background: var(--crit-dim); }
.pill.info { color: var(--info); background: var(--info-dim); }
.pill.muted { color: var(--text-2); background: var(--muted-dim); }
.pill.standby { color: var(--standby); border-color: color-mix(in srgb, var(--standby) 45%, transparent); }
.pill.ghost { color: var(--text-2); border-color: var(--line-2); }
.sev { font: 600 10.5px/18px var(--mono); padding: 0 5px; border-radius: 3px; letter-spacing: 0.02em; }
.sev-1 { background: var(--crit); color: #fff; }
.sev-2 { background: var(--crit-dim); color: var(--crit); }
.sev-3 { background: var(--warn-dim); color: var(--warn); }
.sev-4 { background: var(--muted-dim); color: var(--text-2); }

/* status glyph (shape + colour, never colour alone) */
.sg { display: inline-grid; place-items: center; width: 14px; height: 14px; font-size: 10px; line-height: 1; flex: none; border-radius: 3px; font-weight: 700; }
.sg.operational { color: var(--ok); }
.sg.operational::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.sg.degraded { background: var(--warn); color: #1a1205; } .sg.degraded::before { content: '!'; }
.sg.unavailable { background: var(--crit); color: #fff; } .sg.unavailable::before { content: '×'; font-size: 13px; }
.sg.draining { background: repeating-linear-gradient(135deg, var(--info) 0 2px, transparent 2px 4px); border: 1px solid var(--info); }
.sg.unknown { border: 1px dashed var(--muted); color: var(--muted); } .sg.unknown::before { content: '?'; }
.sg.standby { border: 1.5px solid var(--standby); border-radius: 50%; width: 11px; height: 11px; }
.sg.healthy { color: var(--ok); } .sg.healthy::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.sg.down { background: var(--crit); color: #fff; } .sg.down::before { content: '×'; font-size: 13px; }

.meter { display: inline-block; height: 5px; background: var(--bg-3); border-radius: 2px; overflow: hidden; vertical-align: middle; }
.meter-fill { display: block; height: 100%; border-radius: 2px; }
.meter-fill.tone-ok { background: var(--text-3); }
.meter-fill.tone-warn { background: var(--warn); }
.meter-fill.tone-crit { background: var(--crit); }

.spark { display: block; overflow: visible; }
.spark-line { fill: none; stroke-width: 1.25; vector-effect: non-scaling-stroke; }
.spark-area { stroke: none; opacity: 0.12; }
.spark-line.tone-neutral, .chart-line.tone-neutral { stroke: var(--text-2); } .spark-area.tone-neutral { fill: var(--text-2); }
.spark-line.tone-ok, .chart-line.tone-ok { stroke: var(--ok); } .spark-area.tone-ok { fill: var(--ok); }
.spark-line.tone-warn, .chart-line.tone-warn { stroke: var(--warn); } .spark-area.tone-warn { fill: var(--warn); }
.spark-line.tone-crit, .chart-line.tone-crit { stroke: var(--crit); } .spark-area.tone-crit { fill: var(--crit); }
.spark-line.tone-info, .chart-line.tone-info { stroke: var(--info); } .spark-area.tone-info { fill: var(--info); }
.chart { display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--text-3); font: 9.5px var(--mono); }
.chart .threshold { stroke: var(--text-3); stroke-dasharray: 3 3; }
.chart .thr-label { fill: var(--text-3); }
.chart .onset { stroke: var(--crit); stroke-dasharray: 2 3; opacity: 0.7; }
.chart-line { fill: none; stroke-width: 1.5; }
.chart-line.dashed { stroke-dasharray: 4 3; }

/* ------------------------------------------------------------------ overview: verdict */
.verdict { display: grid; grid-template-columns: minmax(280px, 1.15fr) repeat(4, minmax(150px, 1fr)); border: 1px solid var(--line); border-radius: 6px; background: var(--bg-1); overflow: hidden; }
.verdict-head { padding: 12px 16px; display: flex; gap: 12px; align-items: flex-start; border-right: 1px solid var(--line); position: relative; }
.verdict-head::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
.verdict-head.ok::before { background: var(--ok); } .verdict-head.warn::before { background: var(--warn); } .verdict-head.crit::before { background: var(--crit); }
.verdict-head h1 { margin: 0 0 3px; font-size: 16px; font-weight: 600; letter-spacing: -0.015em; }
.verdict-head p { margin: 0; color: var(--text-2); font-size: 12.5px; }
.verdict-icon { width: 22px; height: 22px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 13px; margin-top: 1px; }
.verdict-icon.ok { background: var(--ok-dim); color: var(--ok); } .verdict-icon.warn { background: var(--warn-dim); color: var(--warn); } .verdict-icon.crit { background: var(--crit); color: #fff; }
.layer { padding: 10px 14px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.layer:last-child { border-right: 0; }
.layer .eyebrow { display: flex; align-items: center; gap: 6px; }
.layer .rank { font: 10px var(--mono); color: var(--text-3); }
.layer-v { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.layer-d { color: var(--text-2); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.crit { background: var(--crit); } .dot.muted { background: var(--muted); } .dot.info { background: var(--info); }

/* request path: Clients → Proxy → Pools */
.path { display: grid; grid-template-columns: 1fr 22px 1.25fr 22px 1.4fr; align-items: stretch; }
.hop { background: var(--bg-1); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; cursor: pointer; text-align: left; }
.hop:hover { border-color: var(--line-2); }
.hop.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
.hop.crit { border-color: var(--crit); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--crit) 40%, transparent); }
.hop-h { display: flex; align-items: center; gap: 8px; }
.hop-h b { font-size: 12.5px; }
.hop-h .grow { flex: 1; }
.hop-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 12px; }
.kv { display: flex; flex-direction: column; min-width: 0; }
.kv .k { color: var(--text-3); font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kv .v { font: 500 13px var(--mono); white-space: nowrap; }
.kv .v small { color: var(--text-3); font-size: 10.5px; font-weight: 400; }
.arrow { display: grid; place-items: center; color: var(--text-3); }
.arrow svg { width: 22px; height: 12px; }
.attrib { display: flex; height: 6px; border-radius: 2px; overflow: hidden; background: var(--bg-3); }
.attrib span { display: block; height: 100%; }

/* metric strip */
.strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 6px; background: var(--bg-1); }
.stat { padding: 9px 12px; border-right: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; gap: 2px 8px; min-width: 0; }
.stat:last-child { border-right: 0; }
.stat .k { grid-column: 1 / -1; color: var(--text-3); font-size: 11px; display: flex; justify-content: space-between; }
.stat .v { font: 500 17px var(--mono); letter-spacing: -0.02em; white-space: nowrap; }
.stat .v small { font-size: 11px; color: var(--text-3); margin-left: 2px; }
.stat .spark { align-self: end; }

.cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 12px; align-items: start; }

/* ------------------------------------------------------------------ tables */
table.t { width: 100%; border-collapse: collapse; font-size: 12px; }
.t th { text-align: left; font-weight: 500; color: var(--text-3); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; background: var(--bg-1); z-index: 1; }
.t th.r, .t td.r { text-align: right; }
.t td { padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
.t tr:last-child td { border-bottom: 0; }
.t tbody tr { cursor: pointer; }
.t tbody tr:hover td { background: var(--bg-2); }
.t tr.sel td { background: var(--bg-3); }
.t tr.attn td:first-child { box-shadow: inset 2px 0 0 var(--warn); }
.t tr.attn-crit td:first-child { box-shadow: inset 2px 0 0 var(--crit); }
.t .name { font-weight: 500; }
.t .sortable { cursor: pointer; } .t .sortable:hover { color: var(--text); }

/* model redundancy pips */
.pips { display: inline-flex; gap: 3px; align-items: center; }
.pips .sg { width: 11px; height: 11px; font-size: 8px; }
.pips .sg.operational::before, .pips .sg.healthy::before { width: 6px; height: 6px; }
.pips .sg.unavailable::before { font-size: 10px; }
.region-cell { display: inline-flex; gap: 3px; min-width: 50px; }

/* ------------------------------------------------------------------ fleet matrix */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.search { position: relative; }
.search input { background: var(--bg-2); border: 1px solid var(--line-2); border-radius: var(--radius); height: 26px; padding: 0 8px 0 26px; width: 220px; }
.search svg { position: absolute; left: 8px; top: 7px; width: 12px; height: 12px; stroke: var(--text-3); fill: none; stroke-width: 2; }
.search kbd { position: absolute; right: 6px; top: 5px; }
kbd { font: 10px var(--mono); color: var(--text-3); border: 1px solid var(--line-2); border-radius: 3px; padding: 0 4px; background: var(--bg-1); }
.chips { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: var(--radius); border: 1px solid var(--line-2); background: none; color: var(--text-2); font-size: 11.5px; }
.chip .n { font-family: var(--mono); color: var(--text-3); }
.chip[aria-pressed='true'] { background: var(--bg-3); color: var(--text); border-color: var(--text-3); }
.chip:disabled { opacity: 0.4; cursor: default; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-2); cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--text-2); margin: 0; }
.tb-sep { width: 1px; height: 18px; background: var(--line); }

.legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 12px 0; color: var(--text-2); font-size: 11.5px; }
.legend .li { display: inline-flex; align-items: center; gap: 6px; }
.legend .ramp { display: inline-flex; align-items: center; gap: 6px; color: var(--text-3); font-size: 11px; }
.legend .ramp i { display: inline-block; width: 70px; height: 8px; border-radius: 2px; background: linear-gradient(90deg, var(--cell-lo), var(--cell-hi)); }

.matrix { padding: 6px 0 8px; }
.grp { display: grid; grid-template-columns: 236px minmax(0, 1fr); align-items: start; padding: 5px 12px; gap: 12px; border-top: 1px solid transparent; }
.grp + .grp { border-top-color: var(--line); }
.grp-h { display: flex; align-items: center; gap: 6px; min-width: 0; background: none; border: 0; padding: 2px 0; text-align: left; color: var(--text); }
.grp-h .caret { width: 10px; color: var(--text-3); font-size: 9px; transition: transform 0.12s; }
.grp.collapsed .caret { transform: rotate(-90deg); }
.grp-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grp-meta { margin-left: auto; display: flex; gap: 6px; align-items: center; font: 11px var(--mono); color: var(--text-3); white-space: nowrap; }
.grp-meta .bad { color: var(--crit); } .grp-meta .warnc { color: var(--warn); }
.cells { display: flex; flex-wrap: wrap; gap: 3px; padding-top: 1px; min-height: 18px; }
.cell {
  width: var(--cell); height: var(--cell); border-radius: 3px; border: 0; padding: 0; position: relative; flex: none;
  background: var(--ok-cell); display: grid; place-items: center; font-size: 10px; font-weight: 700; line-height: 1;
}
.cell:hover { outline: 1px solid var(--text-2); outline-offset: 1px; z-index: 2; }
.cell.sel { outline: 2px solid var(--text); outline-offset: 1px; z-index: 3; }
.cell.s-degraded { background: var(--warn); color: #1a1205; } .cell.s-degraded::before { content: '!'; }
.cell.s-unavailable { background: var(--crit); color: #fff; } .cell.s-unavailable::before { content: '×'; font-size: 13px; }
.cell.s-draining { background: repeating-linear-gradient(135deg, var(--info) 0 2px, var(--info-dim) 2px 5px); }
.cell.s-unknown { background: transparent; border: 1px dashed var(--muted); color: var(--muted); } .cell.s-unknown::before { content: '?'; }
.cell.s-standby { background: transparent; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--standby) 70%, transparent); }
.cell.hot:not(.s-degraded):not(.s-unavailable)::after { content: ''; position: absolute; right: 2px; top: 2px; width: 4px; height: 4px; border-radius: 50%; background: var(--warn); }
.cell.dimmed { opacity: 0.14; }
.cell.metric { color: transparent; }
.cell.metric.s-degraded, .cell.metric.s-unavailable { color: inherit; }
.small-cells { --cell: 11px; }
.small-cells .cell { border-radius: 2px; font-size: 0; }
.small-cells .cell.s-unavailable::before { font-size: 9px; }
.small-cells .cells { gap: 2px; }
.collapsed-bar { display: flex; height: 8px; border-radius: 2px; overflow: hidden; margin-top: 5px; background: var(--bg-3); max-width: 420px; }

  <script>
/* Shared helpers: deterministic randomness, formatting, escaping, SVG charts. */
(function () {
  const IX = (window.IX = window.IX || {});

  // ---- deterministic pseudo-random -------------------------------------------------
  function hash(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  /** Stable value in [0,1) for a key: the same key always gives the same number. */
  function rand(key) {
    let x = hash(String(key)) || 1;
    x ^= x << 13; x ^= x >>> 17; x ^= x << 5;
    return ((x >>> 0) % 100000) / 100000;
  }
  const jitter = (key, spread) => 1 + (rand(key) - 0.5) * 2 * spread;
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const sum = (arr, fn = (x) => x) => arr.reduce((acc, x) => acc + fn(x), 0);
  const groupBy = (arr, fn) =>
    arr.reduce((acc, x) => {
      const k = fn(x);
      return { ...acc, [k]: [...(acc[k] || []), x] };
    }, {});

  // ---- formatting ---------------------------------------------------------------------
  const esc = (s) =>
    String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

  function fmtNum(v, digits = 0) {
    if (v == null || Number.isNaN(v)) return '—';
    if (Math.abs(v) < 0.005) v = 0; // avoid "-0.0" from float residue
    const a = Math.abs(v);
    if (a >= 1e6) return (v / 1e6).toFixed(a >= 1e7 ? 1 : 2) + 'M';
    if (a >= 1e4) return (v / 1e3).toFixed(a >= 1e5 ? 0 : 1) + 'k';
    return v.toLocaleString('en-US', { maximumFractionDigits: digits, minimumFractionDigits: digits });
  }
  const fmtPct = (v, digits = 1) => (v == null ? '—' : (v * 100).toFixed(digits) + '%');
  function fmtSuccess(v) {
    if (v >= 0.99995) return '100.00%';
    return (v * 100).toFixed(v > 0.999 ? 3 : 2) + '%';
  }
  function fmtMs(v) {
    if (v == null) return '—';
    if (v >= 10000) return (v / 1000).toFixed(1) + ' s';
    if (v >= 1000) return (v / 1000).toFixed(2) + ' s';
    return Math.round(v) + ' ms';
  }
  function fmtDur(min) {
    if (min < 1) return '<1m';
    if (min < 60) return Math.round(min) + 'm';
    return Math.floor(min / 60) + 'h ' + Math.round(min % 60) + 'm';
  }
  function fmtAge(sec) {
    if (sec < 60) return Math.round(sec) + 's';
    return Math.floor(sec / 60) + 'm ' + String(Math.round(sec % 60)).padStart(2, '0') + 's';
  }

  // ---- time series ---------------------------------------------------------------------
  /**
   * Synthesise a history ending at `current`. Before the onset the metric sits at
   * `baseline`; it moves to `current` over a short ramp (or `rampMin` for slow drifts).
   */
  function series(key, { current, baseline = current, onsetMin = null, rangeMin, points = 60, noise = 0.025, rampMin = 2 }) {
    const out = [];
    for (let i = 0; i < points; i++) {
      const tMinAgo = rangeMin * (1 - i / (points - 1));
      let v = baseline;
      if (onsetMin != null && tMinAgo <= onsetMin) {
        const k = clamp((onsetMin - tMinAgo) / Math.max(rampMin, 0.01), 0, 1);
        v = baseline + (current - baseline) * k;
      } else if (onsetMin == null) {
        v = current;
      }
      const n = (rand(key + ':' + i) - 0.5) * 2 * noise;
      out.push(i === points - 1 ? current : v * (1 + n));
    }
    return out;
  }

  // ---- SVG charts ----------------------------------------------------------------------
  function pathFor(values, w, h, lo, hi, pad = 1) {
    const span = hi - lo || 1;
    return values
      .map((v, i) => {
        const x = (i / (values.length - 1)) * w;
        const y = pad + (1 - (v - lo) / span) * (h - pad * 2);
        return (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
      })
      .join('');
  }

  function sparkline(values, { w = 96, h = 22, tone = 'neutral', lo, hi, area = true } = {}) {
    const min = lo ?? Math.min(...values);
    const max = hi ?? Math.max(...values);
    const pad = (max - min) * 0.15 || Math.abs(max) * 0.05 || 1;
    const l = lo ?? min - pad;
    const u = hi ?? max + pad;
    const d = pathFor(values, w, h, l, u);
    const fill = area ? `<path d="${d}L${w} ${h}L0 ${h}Z" class="spark-area tone-${tone}"/>` : '';
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" preserveAspectRatio="none" aria-hidden="true">${fill}<path d="${d}" class="spark-line tone-${tone}"/></svg>`;
  }

  /** Small line chart with y gridlines, an optional threshold and onset marker. */
  function lineChart(lines, { w = 400, h = 120, fmt = (v) => fmtNum(v), threshold = null, onsetFrac = null, rangeLabel = '1h', lo = null, hi = null } = {}) {
    const all = lines.flatMap((l) => l.values).concat(threshold != null ? [threshold] : []);
    let min = lo ?? Math.min(...all);
    let max = Math.max(...all);
    if (max === min) { max += Math.abs(max) * 0.1 || 1; min -= Math.abs(min) * 0.1 || 1; }
    const padY = (max - min) * 0.12;
    const l = lo ?? Math.max(0, min - padY);
    const u = hi != null ? Math.min(hi, max + padY) : max + padY;
    const left = 44, right = 6, top = 8, bottom = 18;
    const iw = w - left - right, ih = h - top - bottom;
    const y = (v) => top + (1 - (v - l) / (u - l)) * ih;
    const ticks = [l, (l + u) / 2, u];
    const grid = ticks
      .map((t) => `<line x1="${left}" x2="${w - right}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" class="grid"/><text x="${left - 6}" y="${(y(t) + 3).toFixed(1)}" class="axis" text-anchor="end">${esc(fmt(t))}</text>`)
      .join('');
    const thr = threshold != null
      ? `<line x1="${left}" x2="${w - right}" y1="${y(threshold).toFixed(1)}" y2="${y(threshold).toFixed(1)}" class="threshold"/><text x="${w - right}" y="${(y(threshold) - 3).toFixed(1)}" class="axis thr-label" text-anchor="end">SLO ${esc(fmt(threshold))}</text>`
      : '';
    const onset = onsetFrac != null
      ? `<line x1="${(left + iw * onsetFrac).toFixed(1)}" x2="${(left + iw * onsetFrac).toFixed(1)}" y1="${top}" y2="${top + ih}" class="onset"/>`
      : '';
    const paths = lines
      .map((ln) => {
        const d = ln.values
          .map((v, i) => (i ? 'L' : 'M') + (left + (i / (ln.values.length - 1)) * iw).toFixed(1) + ' ' + y(v).toFixed(1))
          .join('');
        return `<path d="${d}" class="chart-line tone-${ln.tone || 'neutral'} ${ln.dashed ? 'dashed' : ''}"/>`;
      })
      .join('');
    const xl = `<text x="${left}" y="${h - 4}" class="axis">−${esc(rangeLabel)}</text><text x="${w - right}" y="${h - 4}" class="axis" text-anchor="end">now</text>`;
    return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%" role="img">${grid}${thr}${onset}${paths}${xl}</svg>`;
  }

  /** Horizontal meter; `warn`/`crit` thresholds tint the fill. */
  function meter(v, { warn = 0.8, crit = 0.9, w = 64 } = {}) {
    const tone = v >= crit ? 'crit' : v >= warn ? 'warn' : 'ok';
    return `<span class="meter" style="width:${w}px"><span class="meter-fill tone-${tone}" style="width:${(clamp(v, 0, 1) * 100).toFixed(1)}%"></span></span>`;
  }

  Object.assign(IX, { hash, rand, jitter, clamp, sum, groupBy, esc, fmtNum, fmtPct, fmtSuccess, fmtMs, fmtDur, fmtAge, series, sparkline, lineChart, meter });
})();

</script>

  ];

  // Hand-tuned 48-pool layout: pools per region [use1, usw2, euw1, apne1]. Standby slots
  // are marked by index so the design scenario matches the brief exactly.
  const LAYOUT_48 = {
    'llama-70b': [3, 2, 2, 2],
    'qwen-32b': [2, 2, 2, 2],
    'deepseek-r1': [2, 1, 1, 0],
    'llama-8b': [3, 3, 2, 2],
    'mixtral': [2, 1, 2, 1],
    'bge-m3': [3, 3, 3, 2],
  };
  const STANDBY_48 = ['l70-usw2-02', 'l8-euw1-02'];

  const FLEET_SIZES = [10, 48, 100, 250, 500];

  function modelsFor(size) {
    return size <= 100 ? MODELS.filter((m) => !m.large) : MODELS;
  }
  function regionsFor(size) {
    return size >= 250 ? REGIONS : REGIONS.slice(0, 4);
  }

  /** Split `total` into integer counts proportional to `weights` (largest remainder). */
  function apportion(total, weights) {
    const w = IX.sum(weights);
    const raw = weights.map((x) => (x / w) * total);
    const base = raw.map(Math.floor);
    const order = raw.map((x, i) => [x - Math.floor(x), i]).sort((a, b) => b[0] - a[0]);
    const extra = total - IX.sum(base);
    return base.map((b, i) => b + (order.slice(0, extra).some(([, j]) => j === i) ? 1 : 0));
  }

  /** [{model, region}] slots, one per pool. Deterministic for a given size. */
  function layout(size) {
    const models = modelsFor(size);
    const regions = regionsFor(size);
    if (size === 48) {
      return models.flatMap((m) => LAYOUT_48[m.id].flatMap((n, ri) => Array.from({ length: n }, () => ({ model: m, region: regions[ri] }))));
    }
    const perModel = apportion(size - models.length, models.map((m) => m.weight)).map((n) => n + 1);
    return models.flatMap((m, mi) => {
      // Rotate region preference per model so small fleets still spread out.
      const rw = regions.map((r, ri) => r.weight * (ri === mi % regions.length ? 1.6 : 1) * IX.jitter(m.id + r.id, 0.25));
      const perRegion = apportion(perModel[mi], rw);
      // DeepSeek keeps two pools in US East whenever the fleet allows it (failover story).
      if (m.id === 'deepseek-r1' && perModel[mi] >= 2 && perRegion[0] < 2) {
        const donor = perRegion.findIndex((n, i) => i > 0 && n > 0);
        if (donor > 0) { perRegion[donor] -= 1; perRegion[0] += 1; }
      }
      return perRegion.flatMap((n, ri) => Array.from({ length: n }, () => ({ model: m, region: regions[ri] })));
    });
  }

  /** Build the static description of every pool (identity + configuration). */
  function buildFleet(size) {
    const counters = {};
    return layout(size).map((slot, idx) => {
      const { model: m, region: r } = slot;
      const key = m.short + '-' + r.id;
      counters[key] = (counters[key] || 0) + 1;
      const n = counters[key];
      const id = `${key}-${String(n).padStart(2, '0')}`;
      const [lo, hi] = m.replicas;
      const desired = lo + Math.round(IX.rand(id + 'rep') * (hi - lo));
      const isStandby = size === 48 ? STANDBY_48.includes(id) : n > 1 && IX.rand(id + 'sb') < 0.05;
      return {
        id,
        idx,
        model: m.id,
        region: r.id,
        cluster: `k8s-${r.id}-${'abc'[(n - 1 + m.short.length) % (size >= 250 ? 3 : 2)]}`,
        gpu: m.gpus[(n - 1) % m.gpus.length],
        engine: m.engines[(n - 1) % m.engines.length],
        version: `${m.version} · r${140 + Math.round(IX.rand(id + 'ver') * 60)}`,
        desired,
        ready: desired,
        perReplicaRps: m.rps * IX.jitter(id + 'cap', 0.08),
        standby: isStandby,
        forced: null, // 'unavailable' | 'draining' | 'unknown' set by scenarios
        cause: null,
        ttftPenalty: 1,
        telemetryAge: 6 + IX.rand(id + 'age') * 18,
        replicaFaults: [],
      };
    });
  }

  Object.assign(IX, { REGIONS, MODELS, FLEET_SIZES, modelsFor, regionsFor, buildFleet });
})();

/* Turns simulated numbers into the four-layer health assessment shown at the top of
   the dashboard. Ordered by what matters to customers, not by component counts. */
(function () {
  const IX = window.IX;

  const STATUS_META = {
    operational: { label: 'Operational', tone: 'ok', glyph: '●' },
    degraded: { label: 'Degraded', tone: 'warn', glyph: '▲' },
    unavailable: { label: 'Unavailable', tone: 'crit', glyph: '✕' },
    draining: { label: 'Draining', tone: 'info', glyph: '↘' },
    unknown: { label: 'Unknown', tone: 'muted', glyph: '?' },
    standby: { label: 'Standby', tone: 'standby', glyph: '○' },
  };
  const STATUS_ORDER = ['unavailable', 'degraded', 'unknown', 'draining', 'standby', 'operational'];

  const MODEL_STATUS = {
    unavailable: { label: 'Unavailable', tone: 'crit' },
    impaired: { label: 'Partially failing', tone: 'crit' },
    'at-risk': { label: 'Available · N−1 unsafe', tone: 'warn' },
    reduced: { label: 'Available · reduced redundancy', tone: 'warn' },
    available: { label: 'Available', tone: 'ok' },
  };

  function deriveLayers({ platform, models, statusCounts, proxy, pools }) {
    const down = models.filter((m) => m.status === 'unavailable');
    const impaired = models.filter((m) => m.status === 'impaired');
    const latency = models.filter((m) => m.latencyBreach);
    const noN1 = models.filter((m) => !m.failoverOk && m.status !== 'unavailable');
    const failPct = 1 - platform.success;

    const customer = failPct >= 0.001
      ? { tone: 'crit', value: IX.fmtNum(platform.failed, 1) + ' req/s failing', detail: `${IX.fmtSuccess(platform.success)} success · ${IX.fmtPct(failPct, 2)} of requests failing` }
      : latency.length
        ? { tone: 'warn', value: 'Latency impact', detail: `${latency.map((m) => m.name).join(', ')} above latency SLO` }
        : { tone: 'ok', value: 'No impact', detail: `${IX.fmtSuccess(platform.success)} success · latency within SLO` };

    const modelsLayer = down.length || impaired.length
      ? { tone: 'crit', value: `${models.length - down.length}/${models.length} available`, detail: [...down, ...impaired].map((m) => `${m.name} ${m.status === 'unavailable' ? 'down' : 'failing'}`).join(' · ') }
      : models.some((m) => m.status !== 'available')
        ? { tone: 'warn', value: `${models.length}/${models.length} available`, detail: `${models.filter((m) => m.status !== 'available').length} with reduced redundancy` }
        : { tone: 'ok', value: `${models.length}/${models.length} available`, detail: 'Full redundancy' };

    const modelsLayerFinal = !proxy.healthy && !down.length && !impaired.length
      ? { tone: 'warn', value: `${models.length}/${models.length} available`, detail: 'Backends healthy · all models see proxy-origin errors' }
      : modelsLayer;

    const capacity = platform.shed > 0.05
      ? { tone: 'crit', value: 'Shedding load', detail: `${IX.fmtNum(platform.shed, 1)} req/s rejected · no capacity` }
      : noN1.length
        ? { tone: 'warn', value: `${IX.fmtPct(platform.headroom, 0)} headroom`, detail: `N−1 unsafe for ${noN1.length} model${noN1.length > 1 ? 's' : ''}` }
        : { tone: 'ok', value: `${IX.fmtPct(platform.headroom, 0)} headroom`, detail: 'Every model survives losing a pool' };

    const bad = statusCounts.unavailable + statusCounts.degraded + statusCounts.unknown;
    const servingPools = pools.length - statusCounts.draining - statusCounts.standby;
    const components = !proxy.healthy
      ? { tone: 'crit', value: `Proxy ${proxy.ready}/${proxy.desired}`, detail: `Shared routing layer degraded · ${bad} pools unhealthy` }
      : bad
        ? { tone: 'warn', value: `${servingPools - bad}/${servingPools} pools healthy`, detail: `${statusCounts.unavailable} down · ${statusCounts.degraded} degraded · ${statusCounts.unknown} unknown` }
        : { tone: 'ok', value: `${servingPools}/${servingPools} pools healthy`, detail: `Proxy ${proxy.ready}/${proxy.desired} healthy` };

    const satOnly = bad > 0 && !statusCounts.unavailable && !statusCounts.unknown
      && pools.filter((p) => p.status === 'degraded').every((p) => p.util >= 0.8 && p.ready === p.desired && p.ttftPenalty === 1);
    let verdict;
    if (!proxy.healthy) verdict = { tone: 'crit', title: 'Routing layer failure', sub: `Failures originate in the central proxy, not in model pools. ${IX.fmtPct(failPct, 2)} of requests failing.` };
    else if (down.length) verdict = { tone: 'crit', title: `${down.map((m) => m.name).join(', ')} unavailable`, sub: `No eligible pool can serve the model. ${IX.fmtNum(platform.failed, 1)} req/s (${IX.fmtPct(failPct, 2)}) failing.` };
    else if (failPct >= 0.001) verdict = { tone: 'crit', title: 'Customer-facing errors', sub: `${IX.fmtPct(failPct, 2)} of requests failing.` };
    else if (satOnly) verdict = { tone: 'warn', title: 'Serving normally · capacity saturating', sub: `No pool has failed, but ${bad} are saturated and queues are growing. ${noN1.length ? `Losing one pool would overload ${noN1.map((m) => m.name).join(', ')}.` : ''}` };
    else if (bad && customer.tone !== 'crit') verdict = { tone: 'warn', title: latency.length ? 'Serving · latency degraded' : 'Serving normally · infrastructure degraded', sub: `All models available. ${bad} pool${bad > 1 ? 's' : ''} need attention${platform.failoverRps > 0.5 ? `; proxy is failing over ${IX.fmtNum(platform.failoverRps, 0)} req/s` : ''}.` };
    else if (noN1.length) verdict = { tone: 'warn', title: 'Serving normally · capacity running hot', sub: `No failures yet. Losing one pool would overload ${noN1.map((m) => m.name).join(', ')}.` };
    else verdict = { tone: 'ok', title: 'All systems operational', sub: `${models.length} models · ${pools.length} pools · ${IX.fmtNum(platform.demand, 0)} req/s served normally.` };

    return { verdict, customer, models: modelsLayerFinal, capacity, components };
  }

  Object.assign(IX, { STATUS_META, STATUS_ORDER, MODEL_STATUS, deriveLayers });
})();

  const BUDGET_MINUTES_30D = 30 * 24 * 60 * (1 - SLO_AVAILABILITY);
  const BUDGET_REMAINING_BEFORE = 0.78;

  const capOf = (p) => p.ready * p.perReplicaRps;
  const configuredCap = (p) => p.desired * p.perReplicaRps;
  const weightOf = (p) => (p.standby ? 0 : configuredCap(p));
  const isEligible = (p) => p.forced !== 'unavailable' && p.forced !== 'draining' && p.ready > 0;

  // ---- routing ------------------------------------------------------------------------
  function route(pools, models, regions, demandByModelRegion) {
    const room = new Map(pools.map((p) => [p.id, isEligible(p) ? capOf(p) * MAX_UTIL : 0]));
    const alloc = new Map(pools.map((p) => [p.id, 0]));
    const failoverIn = new Map(pools.map((p) => [p.id, 0]));
    const flows = new Map(); // `${model}|${from}|${to}` -> rps
    const addFlow = (m, from, to, v) => flows.set(`${m}|${from}|${to}`, (flows.get(`${m}|${from}|${to}`) || 0) + v);

    // Water-fill `amount` across candidates proportional to weightFn, respecting room.
    function fill(cands, amount, weightFn, { model, from, failover }) {
      let left = amount;
      for (let iter = 0; iter < 10 && left > 1e-6; iter++) {
        const open = cands.filter((p) => room.get(p.id) > 1e-6);
        const W = sum(open, weightFn);
        if (!open.length || W <= 0) break;
        const placed = open.map((p) => {
          const take = Math.min((left * weightFn(p)) / W, room.get(p.id));
          room.set(p.id, room.get(p.id) - take);
          alloc.set(p.id, alloc.get(p.id) + take);
          if (failover) failoverIn.set(p.id, failoverIn.get(p.id) + take);
          addFlow(model, from, p.region, take);
          return take;
        });
        left -= sum(placed);
      }
      return left;
    }

    const leftovers = [];
    for (const m of models) {
      const mp = pools.filter((p) => p.model === m.id);
      for (const r of regions) {
        const d = demandByModelRegion[m.id][r.id] || 0;
        if (!d) continue;
        const local = mp.filter((p) => p.region === r.id && !p.standby);
        // Affinity routing (prefix-cache, session stickiness) keeps load slightly uneven.
        const left = fill(local, d, (p) => weightOf(p) * jitter(p.id + 'aff', 0.14), { model: m.id, from: r.id, failover: false });
        if (left > 1e-6) leftovers.push({ m, r, left, mp });
      }
    }
    const shed = {};
    for (const { m, r, left, mp } of leftovers) {
      let rest = fill(mp.filter((p) => p.region === r.id && p.standby), left, configuredCap, { model: m.id, from: r.id, failover: true });
      rest = fill(mp.filter((p) => p.region !== r.id && !p.standby), rest, (p) => room.get(p.id), { model: m.id, from: r.id, failover: true });
      rest = fill(mp.filter((p) => p.region !== r.id && p.standby), rest, (p) => room.get(p.id), { model: m.id, from: r.id, failover: true });
      shed[m.id] = (shed[m.id] || 0) + rest;
    }
    return { alloc, failoverIn, flows, shed };
  }

  // ---- per-pool telemetry ---------------------------------------------------------------
  function derivePool(p, m, traffic, failover) {
    const cap = capOf(p);
    const util = cap > 0 ? traffic / cap : 0;
    const lf = 1 + 0.35 * util + Math.max(0, util - 0.8) * 9;
    const j = (k, s = 0.06) => jitter(p.id + k, s);
    const chat = m.kind === 'chat';
    const ttftP50 = chat ? m.ttft * lf * p.ttftPenalty * j('ttft') : null;
    const ttftP95 = chat ? ttftP50 * 1.85 : null;
    const tpot = chat ? m.tpot * (1 + 0.45 * util * util) * j('tpot') : null;
    const latP95 = chat ? ttftP95 + tpot * m.outTok * 1.25 : m.latency * lf * 1.7 * j('lat');
    const kv = chat ? clamp(0.12 + util * 0.78 + (p.ttftPenalty > 1 ? 0.09 : 0), 0, 0.99) : null;
    const idle = traffic < 1e-6;
    const gpuUtil = idle ? (p.ready ? 0.03 : 0) : clamp(0.1 + util * 0.88 * j('gpu', 0.03), 0, 0.99);
    const gpuMem = p.ready ? clamp(m.mem + (kv ?? util * 0.3) * (0.95 - m.mem), 0, 0.98) : 0;
    const running = traffic * (latP95 / 1000) * 0.55;
    const hot = Math.max(0, util - 0.82);
    const queued = idle ? 0 : running * (hot * 6 + 0.01);
    const queueWait = idle ? 0 : 2 + hot * (chat ? m.ttft : m.latency) * 9;
    const errRate = idle ? 0 : (p.ready < p.desired ? 0.0016 : 0.0003) + (util > 0.9 ? 0.002 : 0);
    const timeoutRate = idle ? 0 : util > 0.9 ? 0.004 : 0.0002;
    const sloMs = chat ? m.ttftSlo : m.latencySlo;
    const sloMetric = chat ? ttftP95 : latP95;

    const issues = [];
    if (p.forced === 'unavailable') issues.push(p.ready === 0 ? `0/${p.desired} replicas ready` : 'Not serving');
    if (p.forced !== 'unavailable' && p.ready < p.desired) issues.push(`${p.ready}/${p.desired} replicas ready`);
    if (util >= 0.9) issues.push(`Saturated · GPU ${Math.round(gpuUtil * 100)}% · queue ${Math.round(queued)}`);
    if (!idle && sloMetric > sloMs) issues.push(`${chat ? 'TTFT' : 'Latency'} p95 ${IX.fmtMs(sloMetric)} > ${IX.fmtMs(sloMs)} SLO`);
    if (p.forced === 'unknown') issues.push(`Telemetry stale ${IX.fmtAge(p.telemetryAge)}`);

    let status;
    if (p.forced) status = p.forced;
    else if (issues.length) status = 'degraded';
    else if (p.standby && idle) status = 'standby';
    else status = 'operational';

    return {
      ...p, status, issues, traffic, failoverIn: failover, util, capacity: cap, eligible: isEligible(p),
      ttftP50, ttftP95, tpot, latP95, kv, gpuUtil, gpuMem, running, queued, queueWait, errRate, timeoutRate,
      inTokS: traffic * m.inTok, outTokS: traffic * m.outTok, sloMs, sloMetric, hot: util >= 0.8,
    };
  }

  // ---- models ---------------------------------------------------------------------------
  function deriveModel(m, mp, demand, shed, proxyFailFrac, flows, rttMs) {
    const served = sum(mp, (p) => p.traffic);
    const backendErr = sum(mp, (p) => p.traffic * p.errRate);
    const proxyFail = demand * proxyFailFrac;
    const failed = proxyFail + shed + backendErr;
    const elig = mp.filter((p) => p.eligible);
    const capacity = sum(elig, (p) => p.capacity * MAX_UTIL);
    const largest = Math.max(0, ...elig.map((p) => p.capacity * MAX_UTIL));
    const failoverOk = elig.length > 1 && capacity - largest >= served * 0.999;
    const unhealthy = mp.filter((p) => ['unavailable', 'degraded', 'unknown'].includes(p.status));
    const cross = sum([...flows.entries()].filter(([k]) => k.startsWith(m.id + '|') && k.split('|')[1] !== k.split('|')[2]), ([, v]) => v);
    const crossFrac = served ? cross / served : 0;
    const poolMetric = served ? sum(mp, (p) => p.traffic * (p.sloMetric || 0)) / served : null;
    const clientMetric = poolMetric == null ? null : poolMetric + crossFrac * rttMs;
    const success = demand ? 1 - failed / demand : 1;
    const regionsConfigured = [...new Set(mp.map((p) => p.region))];
    const regionsServing = [...new Set(elig.map((p) => p.region))];

    let status = 'available';
    if (!elig.length) status = 'unavailable';
    // Only backend-origin failures make a model "impaired"; proxy-origin errors belong to the proxy.
    else if (demand && 1 - (shed + backendErr) / demand < 0.99) status = 'impaired';
    else if (!failoverOk) status = 'at-risk';
    else if (unhealthy.length) status = 'reduced';
    return {
      ...m, pools: mp, demand, served, failed, shed, proxyFail, backendErr, success, capacity,
      headroom: capacity ? 1 - served / capacity : 0, failoverOk, status, unhealthy, crossRps: cross, crossFrac,
      clientMetric, slo: m.kind === 'chat' ? m.ttftSlo : m.latencySlo, regionsConfigured, regionsServing,
      eligibleCount: elig.length, healthyCount: mp.filter((p) => p.status === 'operational' || p.status === 'standby').length,
      draining: mp.filter((p) => p.status === 'draining').length,
      latencyBreach: clientMetric != null && clientMetric > (m.kind === 'chat' ? m.ttftSlo : m.latencySlo),
    };
  }

  // ---- proxy ----------------------------------------------------------------------------
  function deriveProxy(px, demand, pools, failoverRps, avgDurS) {
    const n = px.replicaCount;
    const downIdx = new Set(Array.from({ length: px.down }, (_, i) => (i * 7 + 2) % n));
    const up = [...Array(n).keys()].filter((i) => !downIdx.has(i));
    const staleIdx = new Set(up.filter((_, k) => k % 2 === 1).slice(0, px.staleConfig));
    const unreachable = pools.filter((p) => p.forced === 'unavailable').length;
    const upstreamErr = unreachable * 0.06 + (px.down ? demand * 0.002 : 0);
    const failFrac = px.internalErrorRate + px.routingFailRate;
    const instances = [...Array(n).keys()].map((i) => {
      const id = `proxy-7f9c-${String.fromCharCode(97 + (i % 26))}${Math.floor(i / 26) || ''}${(i * 37) % 10}`;
      const down = downIdx.has(i);
      const stale = staleIdx.has(i);
      const rps = down ? 0 : (demand / up.length) * jitter(id + 'rps', 0.05);
      const extra = down ? 0 : px.extraLatency * (stale ? 1.4 : 0.8);
      return {
        id, zone: `use1-az${(i % 3) + 1}`, status: down ? 'down' : stale || px.extraLatency ? 'degraded' : 'healthy',
        reason: down ? 'OOMKilled · CrashLoopBackOff' : stale ? 'Routing config rc-1356 (expected rc-1412)' : px.extraLatency ? 'Elevated load from failed peers' : null,
        rps, conns: rps * avgDurS, p50: down ? null : (1.4 + extra * 0.4) * jitter(id + 'p50', 0.08), p99: down ? null : (5.2 + extra * 2.2) * jitter(id + 'p99', 0.1),
        errRate: down ? null : stale ? px.routingFailRate * (up.length / Math.max(1, staleIdx.size)) + px.internalErrorRate : px.internalErrorRate,
        upstreamErr: down ? 0 : upstreamErr / up.length, config: stale ? 'rc-1356' : 'rc-1412',
        cpu: down ? 0 : clamp(0.34 * (demand / up.length) / (demand / n) * jitter(id + 'cpu', 0.1), 0, 0.98),
        mem: down ? 0 : clamp((px.down ? 0.86 : 0.46) * jitter(id + 'mem', 0.06), 0, 0.99), restarts: down ? 6 + (i % 4) : 0,
      };
    });
    const ready = up.length;
    const inSync = instances.filter((x) => x.status !== 'down' && x.config === 'rc-1412').length;
    return {
      ...px, instances, ready, desired: n, inSync, rps: demand, conns: demand * avgDurS,
      p50: sum(instances.filter((x) => x.p50), (x) => x.p50) / ready, p99: Math.max(...instances.filter((x) => x.p99).map((x) => x.p99)),
      upstreamErr, routingFail: demand * px.routingFailRate, internalErr: demand * px.internalErrorRate, failFrac,
      retryRate: 0.0021 + (failoverRps / Math.max(demand, 1)) * 0.06 + failFrac * 0.5, failoverRate: failoverRps / Math.max(demand, 1),
      discovered: pools.length, eligible: pools.filter((p) => p.eligible).length,
      healthy: px.down === 0 && px.staleConfig === 0 && failFrac < 0.001,
    };
  }

  // ---- incidents ----------------------------------------------------------------------
  function deriveIncident(spec, ctx) {
    const { poolsById, modelsById, platform, pools } = ctx;
    const primary = spec.primary.map((id) => poolsById[id]).filter(Boolean);
    const related = spec.related ? pools.filter((p) => p.model === spec.related.model && p.util >= spec.related.minUtil && !spec.primary.includes(p.id)) : [];
    const sat = spec.saturation ? pools.filter((p) => spec.saturation.includes(p.model) && p.util >= 0.85) : [];
    const affected = [...primary, ...related, ...sat];
    const modelIds = spec.proxy ? Object.keys(modelsById) : [...new Set(affected.map((p) => p.model))];
    const models = modelIds.map((id) => modelsById[id]);
    // Count only failures above the healthy baseline (background error rate is not impact).
    const baseFailed = (m) => (ctx.baseline ? ctx.baseline.modelsById[m.id].failed : 0);
    const failed = spec.proxy ? platform.proxyFail : spec.observability ? 0 : Math.max(0, sum(models, (m) => m.failed - baseFailed(m)));
    const failedFrac = failed / platform.demand;
    const lostCap = sum(primary, (p) => configuredCap(p) - p.capacity);
    const modelCap = sum(models, (m) => sum(m.pools, configuredCap));
    const breach = models.filter((m) => m.latencyBreach);
    const failover = sum(primary.length ? models : [], (m) => m.crossRps);

    let severity = 3;
    if (spec.observability) severity = 4;
    else if (spec.proxy || spec.modelOutage || failedFrac >= 0.01) severity = 1;
    else if (failed > 0.5 || models.some((m) => !m.failoverOk)) severity = 2;

    const impactParts = [];
    if (failed > 0.05) impactParts.push(`${IX.fmtNum(failed, 1)} req/s failing (${IX.fmtPct(failedFrac, 3)} of traffic)`);
    else impactParts.push('No failed requests');
    if (breach.length) impactParts.push(`${breach.map((m) => m.name).join(', ')} latency above SLO`);
    else if (failover > 0.5 && !spec.observability) impactParts.push(`+${Math.round(ctx.rttMs)} ms for ${IX.fmtNum(failover, 0)} req/s served cross-region`);
    const customer = failed > 0.05 ? 'crit' : breach.length || failover > 0.5 ? 'warn' : 'none';

    return {
      ...spec, severity, affected, primaryPools: primary, relatedPools: [...related, ...sat], models, failed, failedFrac, customer,
      impact: impactParts.join(' · '),
      capacityImpact: spec.proxy ? `Proxy capacity −${Math.round((platform.proxy.down / platform.proxy.desired) * 100)}%` : lostCap > 0 ? `−${IX.fmtPct(lostCap / modelCap, 0)} ${models.length === 1 ? models[0].name : 'model'} capacity` : sat.length ? `${sat.length} pools ≥85% util · N−1 unsafe` : '—',
      regions: [...new Set(affected.map((p) => p.region))],
      score: severity * 1e6 - failed * 1e3 - affected.length,
    };
  }

  // ---- world ----------------------------------------------------------------------------
  function buildWorld(size, scenarioId) {
    const models = IX.modelsFor(size);
    const regions = IX.regionsFor(size);
    const sc = IX.scenarioById(scenarioId).apply(IX.buildFleet(size), size);
    const pools0 = sc.pools;
    const rttMs = sc.crossRegionRttMs || BASE_RTT_MS;

    const demand = Object.fromEntries(models.map((m) => {
      const mp = pools0.filter((p) => p.model === m.id);
      const total = sum(mp, weightOf) * BASE_LOAD * jitter(m.id + 'load', 0.06) * (sc.demandMult[m.id] || 1);
      const totalW = sum(mp, weightOf) || 1;
      // Client demand per region is skewed vs. provisioned capacity, then renormalised.
      const raw = regions.map((r) => (sum(mp.filter((p) => p.region === r.id), weightOf) / totalW) * jitter(m.id + r.id + 'dem', 0.2));
      const rawSum = sum(raw) || 1;
      return [m.id, Object.fromEntries(regions.map((r, i) => [r.id, (total * raw[i]) / rawSum]))];
    }));
    const px = sc.proxy;
    const proxyFailFrac = px.internalErrorRate + px.routingFailRate;
    const routed = Object.fromEntries(Object.entries(demand).map(([m, byR]) => [m, Object.fromEntries(Object.entries(byR).map(([r, d]) => [r, d * (1 - proxyFailFrac)]))]));
    const { alloc, failoverIn, flows, shed } = route(pools0, models, regions, routed);

    const modelById0 = Object.fromEntries(models.map((m) => [m.id, m]));
    const pools = pools0.map((p) => derivePool(p, modelById0[p.model], alloc.get(p.id), failoverIn.get(p.id)));
    const modelList = models.map((m) => deriveModel(m, pools.filter((p) => p.model === m.id), sum(Object.values(demand[m.id])), shed[m.id] || 0, proxyFailFrac, flows, rttMs));
    const modelsById = Object.fromEntries(modelList.map((m) => [m.id, m]));
    const poolsById = Object.fromEntries(pools.map((p) => [p.id, p]));

    const totalDemand = sum(modelList, (m) => m.demand);
    const served = sum(pools, (p) => p.traffic);
    const failoverRps = sum(pools, (p) => p.failoverIn);
    const crossRps = sum([...flows.entries()].filter(([k]) => k.split('|')[1] !== k.split('|')[2]), ([, v]) => v);
    const avgDurS = served ? sum(pools, (p) => p.traffic * (p.latP95 / 1000) * 0.6) / served : 1;
    const proxy = deriveProxy(px, totalDemand, pools, failoverRps, avgDurS);
    const proxyFail = sum(modelList, (m) => m.proxyFail);
    const shedTotal = sum(modelList, (m) => m.shed);
    const backendErr = sum(modelList, (m) => m.backendErr);
    const failed = proxyFail + shedTotal + backendErr;
    const success = 1 - failed / totalDemand;
    const chat = modelList.filter((m) => m.kind === 'chat' && m.served);
    const chatServed = sum(chat, (m) => m.served);
    const ttftP95 = sum(chat, (m) => m.served * (m.clientMetric || 0)) / (chatServed || 1) + px.extraLatency;
    const eligibleCap = sum(pools.filter((p) => p.eligible), (p) => p.capacity * MAX_UTIL);
    const platform0 = {
      demand: totalDemand, served, failed, proxyFail, shed: shedTotal, backendErr, success, ttftP95, failoverRps, crossRps,
      inTokS: sum(pools, (p) => p.inTokS), outTokS: sum(pools, (p) => p.outTokS), headroom: eligibleCap ? 1 - served / eligibleCap : 0,
      proxy, sloTarget: SLO_AVAILABILITY, budgetBefore: BUDGET_REMAINING_BEFORE,
    };

    const baseline = scenarioId === 'normal' ? null : getWorld(size, 'normal');
    const ctx = { poolsById, modelsById, platform: platform0, pools, rttMs, baseline };
    const incidents = (sc.incidents || []).map((s) => deriveIncident(s, ctx)).sort((a, b) => a.score - b.score);
    // History onset = the most severe incident; budget burn accrues over its duration.
    const onsetMin = incidents.length ? incidents[0].onsetMin : null;
    const burnRate = (1 - success) / (1 - SLO_AVAILABILITY);
    const budgetUsed = onsetMin != null ? ((1 - success) * onsetMin) / BUDGET_MINUTES_30D : 0;
    const platform = { ...platform0, onsetMin, burnRate, budgetRemaining: clamp(BUDGET_REMAINING_BEFORE - budgetUsed, 0, 1) };
    const statusCounts = ['operational', 'degraded', 'unavailable', 'draining', 'unknown', 'standby'].reduce((acc, s) => ({ ...acc, [s]: pools.filter((p) => p.status === s).length }), {});
    const stale = pools.filter((p) => p.telemetryAge > 120);

    return {
      size, scenario: scenarioId, models: modelList, modelsById, regions, pools, poolsById, flows, platform, incidents, statusCounts,
      stale, rttMs, demand, layers: IX.deriveLayers({ platform, models: modelList, statusCounts, proxy, pools }),
      poolIncident: Object.fromEntries(incidents.flatMap((inc) => inc.affected.map((p) => [p.id, inc.id]))),
    };
  }

  const cache = new Map();
  function getWorld(size, scenarioId) {
    const key = size + '|' + scenarioId;
    if (!cache.has(key)) cache.set(key, buildWorld(size, scenarioId));
    return cache.get(key);
  }

  Object.assign(IX, { getWorld, MAX_UTIL, isEligible, configuredCap, weightOf });
})();
